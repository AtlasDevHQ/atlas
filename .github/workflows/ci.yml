name: CI

on:
  push:
    branches: [main, "milestone/**", "hotfix/**"]
  pull_request:
    branches: [main, "milestone/**"]
  # Manual lever: lets an operator/agent re-create required check runs when
  # GitHub drops pull_request event deliveries (observed 2026-06-10 on #3358).
  workflow_dispatch:

# `milestone/**` is the long-running integration-branch namespace (first user:
# `milestone/v0.2.0-brain-m1`). Without it, a PR stacked onto a milestone branch
# would run ZERO required checks — branch protection is `main`-only, so nothing
# else would catch a regression until the whole milestone landed on `main` in one
# merge. The `push:` half is deliberate too: it gives the milestone branch a
# post-merge integration signal, which is what catches a semantic conflict
# between two stacked PRs that were each green in isolation.
#
# Precedent, Brain M2 (2026-07-31): M2 was reverted from `main` (`0bb5d9130`) and
# its re-landing arc was cut as `chore/brain-m2-to-main` — outside this filter.
# PRs #4942/#4944/#4945/#4946/#4947 each merged onto it with `fork-pr-gate` as
# their ONLY check, and three of four authors independently fired a
# `workflow_dispatch` to compensate. Nothing was bypassed (branch protection is
# `main`-only, so there was no gate to override), but the arc's safety rested
# entirely on local `/ci` runs. The arc was moved back onto `milestone/brain-m2`
# rather than adding the branch name here. Do that, not this — an integration
# branch in this namespace is gated with no config change at all.
#
# Caveat, by design: `Analyze (javascript-typescript)` (CodeQL default setup) is
# `main`-only and cannot be branch-filtered here, so milestone-branch PRs are
# gated by everything EXCEPT CodeQL. It runs on the milestone branch's own PR
# into `main`, which is the merge that matters for that gate.
#
# `hotfix/**` is `push:`-only, and the asymmetry is the point. A hotfix cut when
# `main` is NOT prod-plus-one-fix branches from the tag `prod` serves, so the SHA
# that ships is never the SHA a PR tests: `pull_request` checks run against the
# MERGE result (`main` + the fix, including whatever unreleased arc `main` is
# carrying), which is a different tree than prod receives. The `push:` trigger is
# what puts CI on the hotfix commit itself. No `pull_request` entry is needed —
# a hotfix PR targets `main`, so it already matches the filter above.
# Runbook: docs/development/release-process.md § When `main` is NOT a safe
# hotfix source.

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

# The historic `ci` job was a single linear pipeline (install → drift → build
# → type → lint → test:others → test:e2e:integration) that took ~3m30s end-
# to-end. Most of those steps are independent. Splitting them into parallel
# jobs drops the critical path to ~1m30s on warm cache. The umbrella `ci`
# job at the bottom (`needs: [...]`, `if: always()`) keeps the single `ci`
# context that branch protection on `main` requires — mirrors the
# `Deploy Validation` umbrella pattern in deploy-validation.yml.
#
# Every job's preamble (setup-bun + shared dependency cache keyed on
# `bun.lock`'s hash + `bun install --frozen-lockfile`) is the
# `.github/actions/setup-bun-cached` composite action — bump pins or install
# behavior there, once. Cold runs (new lockfile) install in full; warm runs
# (lockfile unchanged) reuse extracted packages and drop install time from
# ~10s to ~1-2s. The cache is shared across every job here and in the other
# bun workflows.

jobs:
  # Path gate for `ee-stub-build` only. That job re-runs a full type-check +
  # build with ee/ stubbed (~2 min), but a change that touches nothing except
  # documentation structurally cannot introduce a core → ee import — so it
  # skips on pure-docs diffs. The filter is INVERTED relative to
  # deploy-validation.yml's: instead of enumerating paths that trigger the
  # job, it enumerates the only paths that are safe to skip on (docs, .claude,
  # markdown) and runs on everything else, so a new top-level directory is
  # gated by default rather than silently exempt. Fail-safe: if the diff
  # can't be computed, run.
  changes:
    name: Detect ee-stub-relevant changes
    runs-on: ubuntu-latest
    outputs:
      ee-stub: ${{ steps.filter.outputs.ee-stub }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history so $BASE_SHA is reachable from a PR fork point.
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$BASE_SHA...$HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            # The WHOLE push, not HEAD~1: a 3-commit push whose tip commit is
            # docs-only must still gate on the first two. A force-push makes
            # BEFORE_SHA unreachable — git diff then fails and the fail-safe
            # below runs the job.
            RANGE="$BEFORE_SHA...HEAD"
          else
            # workflow_dispatch has no diff scope — it exists to re-create
            # REQUIRED check runs when GitHub drops event deliveries (#3358),
            # so it must never skip a gate. New-branch pushes (BEFORE_SHA all
            # zeros) have no base either. Run unconditionally.
            echo "ee-stub=true" >> "$GITHUB_OUTPUT"
            echo "No reliable diff range for $EVENT_NAME — running ee-stub-build"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$RANGE" 2>&1); then
            echo "::warning::git diff $RANGE failed: $CHANGED — defaulting ee-stub to true"
            echo "ee-stub=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run unless EVERY changed file is docs-only. `.mdx` (apps/docs
          # content) deliberately does NOT match `\.md$` — apps/docs is a
          # Next.js app covered by `bun run build`, so it stays gated in.
          #
          # Herestring, not `echo | grep`: with pipefail, `grep -q` exiting
          # early can SIGPIPE the writer on a large diff and flip the
          # pipeline status to 141 — misclassifying a huge non-docs diff as
          # docs-only. Herestring input has no writer to kill; grep's own
          # exit status alone decides.
          if grep -vqE '^(docs/|\.claude/|[^/]*\.md$)' <<<"$CHANGED"; then
            echo "ee-stub=true" >> "$GITHUB_OUTPUT"
            echo "Non-docs paths changed — running ee-stub-build"
          else
            echo "ee-stub=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only diff — skipping ee-stub-build"
          fi

  drift:
    name: drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check dependency versions (syncpack)
        run: bun x syncpack lint

      # One script, called from here and from ci-local.sh. It was an inline
      # `run:` block here plus a hand-copied `g_dockerfile_pins` in ci-local.sh
      # that said it "must match ci.yml's copy" — and the two already differed on
      # a digitless `oven/bun:` pin. The `Dockerfile*` glob (not `Dockerfile`)
      # and its #2802 sidecar history live in the script's header.
      - name: Check Dockerfile bun version pins
        env:
          EXPECTED_BUN: ${{ env.BUN_VERSION }}
        run: bash scripts/check-dockerfile-bun-pins.sh

      # Both this workflow (the `gate-fixtures` job) and ci-local.sh now run the
      # fixture suites through `scripts/run-gate-fixtures.sh`, a glob — this
      # workflow used to ENUMERATE them as 30 named steps, which is the drift
      # this gate was built for (#5296). It now guards what a glob cannot: that
      # the runner is invoked at all, and that every suite the runner SKIPS
      # (`scripts/gate-fixtures-exclude.txt`) is run by the workflow that
      # installs its tool.
      - name: Check every fixture suite is run by a workflow (#5296)
        run: bash scripts/check-gate-fixtures-wired.sh

      # The sibling of the gate above, for the check-* GATES rather than the
      # fixture suites: this job and ci-local.sh each enumerate their gates by
      # hand, and `check-caddyfile.sh` + `check-template-deps.ts` ran here and
      # never locally until this compared the two lists.
      - name: Check ci.yml and ci-local.sh run the same check-* gates
        run: bash scripts/check-ci-local-parity.sh

      # The enforcement half of docs/agents/practices.md. Until this existed,
      # that page's own claims were unenforced prose — the failure mode it
      # describes. Three false paths and six dead command references were found
      # BY HAND in the 2026-08-17 audit; nothing in CI could catch a fourth.
      - name: Check no doc names a missing path, command or count (#5299)
        run: bash scripts/check-agent-doc-paths.sh

      # A test file's HEADER is load-bearing prose here — it argues why a suite
      # is split from its sibling, and source comments say "X is pinned by
      # foo.test.ts". Nothing checked that the named file still existed. Folding
      # 121 satellite suites on 2026-09-04 rotted ~20 such pointers in one
      # change, 4 of them in production source, and every one had to be found by
      # hand. A merge moves the target; it does not remove the reader's need.
      - name: Check no comment names a test file that no longer exists
        run: bash scripts/check-test-file-references.sh

      # Three brand invariants that prose asked for and nothing measured: the
      # root <body> hardcoded white/zinc over the tokenized ground, the SQL pane
      # rendered light-on-white in light mode, and neither brand font loaded.
      - name: Check the product surface follows its brand tokens (#5306)
        run: bash scripts/check-web-brand-tokens.sh

      # ⚠️ THE SOURCE-SCAN SIBLING OF check-test-discipline.sh, AND THE REASON
      # ITS ALLOWLIST IS SAFE. That gate reads the TREE; this one reads BUN.
      #
      # `scripts/test-discipline-allowlist.txt` lets 9 files write
      # `process.env.X` at module top level. They are safe only because
      # `bun test --parallel` gives each test FILE its own env and cwd even when
      # bun packs many into one worker process — measured behaviour on 1.4.0,
      # promised by no documentation. A bun upgrade that regressed it would make
      # those 9 files start corrupting whatever file the scheduler placed next,
      # and nothing else in CI would notice. This step notices (#5368).
      - name: Check bun's --parallel isolation contract still holds (#5368)
        run: bash scripts/check-bun-isolation-contract.sh

      - name: Check Dockerfile workspace completeness
        run: bash scripts/check-dockerfile-workspace.sh

      # ⚠️ Two arms, and the second one is the reason this gate can now fail for
      # the class it was filed for. The COPY-source arm skips the api
      # Dockerfile's broad `COPY . .` by design — and that one line bundles every
      # package in the repo, so the set of change-relevant files is the workspace
      # dependency CLOSURE of what the image ships, not the set of COPY sources.
      # A miss there does not fail a deploy, it SKIPS one: Railway answers
      # `skippedReason: "No changes to watched files"` and the release silently
      # never ships (#4733/#4734, hand-fixed in #4737). Measured before this
      # change: the gate reported "All 54 COPY sources covered" and exit 0 while
      # `packages/okf-bundle` was copied into the api image and watched by nobody.
      - name: Check Railway watchPatterns cover every bundled workspace path (#4738)
        run: bash scripts/check-railway-watch.sh

      - name: Check template drift
        run: bash scripts/check-template-drift.sh

      # `check-template-drift.sh` above compares template SOURCE against monorepo
      # source and reads no manifest; syncpack (first step of this job) reconciles
      # version RANGES for deps in more than one manifest. Neither can see a dep
      # that is in NO template manifest — which is how a new `import` under
      # `packages/api/src/lib/**` reached every scaffolded project's source but
      # not its package.json, surfacing later as a Deploy Validation scaffold
      # failing `npm install` in a run whose diff held no clue (#5354/#5419).
      # This gate owns PRESENCE; syncpack still owns RANGES. --skip-prepare
      # because check-template-drift.sh has just generated the templates.
      - name: Adversarial fixtures for the template-deps gate (#5421)
        run: bun scripts/check-template-deps.ts --self-test

      - name: Check template deps declared (#5421)
        run: bun scripts/check-template-deps.ts --skip-prepare

      # `deploy/docs/Caddyfile` is the ONLY redirect layer for apps/docs — the
      # site is `output: "export"`, which disables Next's `redirects()`. It was
      # asserted only AS TEXT (redirect-coverage.test.ts, security-txt-redirect.test.ts
      # string-match lines), so a syntax error passed lint/type/drift/every test,
      # passed `Built image (docs)` too — the Dockerfile COPYs it without
      # adapting it — and then killed the container at boot, on the deploy the
      # redirects need in order to exist. #5236 added 28 `redir` lines in one
      # block, the largest single addition that file has had.
      #
      # The gate adapts it with the digest-pinned image READ OUT OF
      # deploy/docs/Dockerfile, so it validates against the binary that serves
      # it and no second pin can drift. `ubuntu-latest` has docker; the gate
      # exits 2 rather than 0 when it does not, so a runner without it fails
      # loudly instead of looking green.
      - name: Check deploy/docs/Caddyfile is a valid Caddy config (#5242)
        run: bash scripts/check-caddyfile.sh

      # The Lighthouse report path was duplicated EIGHT ways — `lighthouserc.js`'s
      # `upload.outputDir`, the verify step's `dir=`, its diagnostic `find`, the
      # artifact `path:` and `name:`, the renderer's `REPORT_ROOT`, `.gitignore`,
      # and a customer-facing claim in `apps/docs`. #4899 was born of exactly that
      # shape: a `mv` target that no longer agreed with what lhci wrote, silent for
      # three months. The gate EXECUTES lighthouserc.js rather than grepping it, and
      # derives the form-factor allowlist from that config's own validation error.
      - name: Check Lighthouse report paths agree with lighthouserc.js (#5174)
        run: bash scripts/check-lighthouse-report-paths.sh

      - name: Check no publishable package version is merged-but-unpublished
        run: bun scripts/check-unpublished-versions.ts

      - name: Check security-headers drift
        run: bash scripts/check-security-headers-drift.sh

      - name: Check pricing-page entitlement mirror ↔ FEATURE_ENTITLEMENTS drift (#3996)
        run: bash scripts/check-pricing-parity.sh

      - name: Check canonical plugin count is consistent across surfaces (#4066)
        run: bash scripts/check-plugin-count.sh

      - name: Check the launch sentence renders verbatim on every surface (#5606)
        run: bash scripts/check-launch-sentence.sh

      - name: Check boot-loaded plugins ↔ api Dockerfile wiring lockstep (#4880)
        run: bun scripts/check-plugin-lockstep.ts

      - name: Check entitlement SSOT ↔ route-layer enforcement drift (#3997)
        run: bash scripts/check-enforcement-parity.sh

      - name: Check Drizzle schema ↔ migration drift
        run: bash scripts/check-schema-drift.sh

      - name: Check migration rename/drop discipline (expand-contract, #3686)
        run: bash scripts/check-migration-rename-discipline.sh

      - name: Check vendored @atlas/oauth-helper ↔ canonical drift
        run: bash scripts/check-oauth-helper-drift.sh

      - name: Check core never imports from @atlas/ee
        run: bash scripts/check-ee-imports.sh

      - name: Check Twenty operator resolver is confined to ee/saas-crm (#2850)
        run: bash scripts/check-twenty-resolver-imports.sh

      - name: Check the Better Auth admin plugin stays removed (#3159)
        run: bash scripts/check-no-admin-plugin.sh

      - name: Check streaming agent responses attach CORS headers (#2037)
        run: bash scripts/check-streaming-cors.sh

      - name: Check no legacy `connections` / `connection_groups` SQL outside migrations (#2744)
        run: bash scripts/check-no-legacy-connections-sql.sh

      - name: Check brain facts are promoted only by the atomic publish endpoint (#4769)
        run: bash scripts/check-brain-fact-promotion.sh

      - name: Check test-file discipline (1.5.4 / #2796)
        run: bash scripts/check-test-discipline.sh

      - name: Check settings-registry reader presence (#3382)
        run: bash scripts/check-settings-readers.sh

      - name: Check SaaS env reference ↔ SAAS_ENV_KEYS drift (#3707)
        run: bash scripts/check-saas-env-doc.sh

      - name: Check Company Atlas env reference ↔ settings registry (#5161)
        run: bun scripts/check-brain-settings-doc.ts

      - name: Check /auth.md ↔ .well-known discovery parity (#3825)
        # Runs from packages/api so the guard's `@atlas/api/*` imports resolve.
        run: cd packages/api && bun scripts/check-auth-md-discovery-parity.ts

      - name: Check apex agent-discovery artifacts drift (auth.md + oauth-protected-resource)
        run: bash scripts/check-apex-discovery-drift.sh

      - name: Check docs internal links + anchors (#4480)
        run: bun scripts/check-docs-links.ts

      - name: Check REST endpoint removals are ledgered on the stability page (2026-08-27 audit)
        # The gate diffs openapi.json's path set against the latest v* release
        # tag; the Actions clone is shallow and tag-less, so fetch the release
        # tags as their own shallow tips first. A plain `git fetch --tags` does
        # NOT work here — a shallow repo rejects every tag with "shallow roots
        # are not allowed to be updated" — and without tags the gate DECLINES
        # (exit 3) rather than passing vacuously.
        run: |
          git fetch --depth=1 --force --quiet origin '+refs/tags/v*:refs/tags/v*'
          bun scripts/check-openapi-removals.ts

      - name: Check published Brain* contract snippets against their declarations (#5165)
        run: bun scripts/check-docs-brain-snippets.ts

  # The adversarial fixture suites — every `scripts/__tests__/*.test.sh` —
  # as their own job. They sat inside `drift` as 30 named steps and were ~60%
  # of its wall clock (measured on #5647's run: drift 298s, the suites ~175s of
  # it, `check-scripts-typecheck.test.sh` alone 74s because it runs the shipped
  # repo-wide lint commands), which made `drift` the critical path of the whole
  # workflow. Beside it, both finish near the api-tests shards. Serial WITHIN
  # the job, deliberately: several suites rewrite tracked source and
  # trap-restore it (see the runner's header), so they cannot fan out.
  #
  # The roster is the directory listing, same as ci-local.sh — see
  # scripts/run-gate-fixtures.sh. A suite that needs a tool this runner lacks
  # is listed in scripts/gate-fixtures-exclude.txt and runs from the workflow
  # that installs it; check-gate-fixtures-wired.sh (in `drift`) requires that.
  # No Postgres: none of the suites need one.
  gate-fixtures:
    name: gate-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run every adversarial fixture suite under scripts/__tests__/
        run: bash scripts/run-gate-fixtures.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Lint
        run: bun run lint

  # Type-aware lint (oxlint --type-aware via tsgolint). Kept out of the fast
  # `lint` job on purpose: it builds full TS programs per package (~1.5min of
  # CPU vs seconds for the syntax pass), so it runs as its own parallel job.
  # It joins the `ci` umbrella below — a type-aware regression blocks merges
  # exactly like a syntax-lint failure (ADR-0031: promoted rules are at
  # `error` and 0 repo-wide; the remaining `warn` rules are permanent
  # non-targets and do not fail this job).
  lint-type-aware:
    name: lint-type-aware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # tsgolint's per-package programs resolve @useatlas/* via each package's
      # "exports" → dist/*.d.ts (e.g. @atlas/web imports @useatlas/sdk). A
      # missing dist makes those imports resolve to error-types-that-act-as-any,
      # which can both mask real findings and fabricate phantom ones (the
      # wave-4/5 config-artifact class in ADR-0031). Build all four so the
      # programs match what `bun run type` checks. Same set as test-others.
      - name: Build SDK packages
        run: bun run build:sdk

      - name: Type-aware lint
        run: bun run lint:type-aware

  type:
    name: type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # `bun run type` builds the SDK packages it needs internally
      # (@useatlas/types, plugin-sdk, sdk, react), runs tsgo --noEmit, then
      # `type:scripts` (tsconfig.scripts.json — the repo-root scripts/ dir,
      # excluded from the root program and unchecked by anything until #5173),
      # and finishes with `@atlas/web type` + `@atlas/www type` +
      # `@atlas/docs type` (#5083 — apps/docs is EXCLUDED from the root
      # tsconfig, so until it was chained here a type error in it was invisible
      # to every gate). The docs arm needs `apps/docs/.source/` — gitignored,
      # emitted by that workspace's `postinstall: fumadocs-mdx` — so unlike the
      # others it is not self-contained; `bun install --frozen-lockfile` in
      # setup-bun-cached runs that postinstall, which is what makes it work.
      #
      # tsgo parallelism (--checkers/--builders) was benchmarked and declined
      # (#4446): on this 4-vCPU runner class the tsgo default (4 checkers, as
      # of the pinned 7.0.0-dev preview) is already optimal for the root
      # program — ~20s vs ~34s single-checker, and 5-8 checkers regress
      # (~21-24s, oversubscription). --builders only affects `tsc -b` build
      # mode, which nothing here uses; the tsgo declaration-emit builds
      # (types/plugin-sdk/sdk) and the www program are
      # sub-second, and the web program (~580 files, ~8s) runs the same
      # already-optimal default. Re-benchmark before adding flags if this job
      # moves to a higher-core runner class or tsgo's parallelism defaults
      # change.
      - name: Type check
        run: bun run type

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build SDK packages
        run: bun run build:sdk

      - name: Build
        run: bun run build

      - name: Check OpenAPI ↔ api-reference drift
        # Runs after SDK + widget + app builds so extract-openapi.ts can
        # resolve @useatlas/types and other built dependencies at import time.
        run: bash scripts/check-openapi-drift.sh

  test-others:
    name: test-others
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # @atlas/web tests import from @useatlas/sdk (e.g. via
      # use-starter-prompts-query.ts), and the SDK packages resolve to their
      # `dist/` via their "exports" field — so all four must be built before
      # test:others runs. The historic monolithic ci built them in order
      # before test:others; we preserve that here. (Cost is ~5-7s on warm
      # cache, dominated by the @useatlas/react widget bundle.)
      - name: Build SDK packages
        run: bun run build:sdk

      # Dedicated, throwaway scratch DB for the @atlas/ee backup-restorability
      # smoke (#2941). verifyBackup's full-restore path DROPs the scratch DB's
      # public schema on every run, so it MUST be its own isolated database —
      # never the service's default `atlas` DB. We create it here and point ONLY
      # ATLAS_BACKUP_VERIFY_SCRATCH_URL_TEST at it on the test step below. We do
      # NOT set a global TEST_DATABASE_URL on test-others — that would flip other
      # packages' real-PG-gated tests and risk side effects.
      - name: Create backup-verify scratch database
        env:
          PGPASSWORD: atlas
        run: psql -h localhost -p 5432 -U atlas -d atlas -c "CREATE DATABASE atlas_backup_scratch"

      - name: Test (non-api packages)
        env:
          ATLAS_BACKUP_VERIFY_SCRATCH_URL_TEST: postgresql://atlas:atlas@localhost:5432/atlas_backup_scratch
        run: bun run test:others
    services:
      # Postgres for the @atlas/ee backup-restorability real-PG smoke (#2941).
      # The backup-verify tests skip cleanly when ATLAS_BACKUP_VERIFY_SCRATCH_URL_TEST
      # is unset, so a future runner without this service degrades gracefully.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  test-e2e-integration:
    name: test-e2e-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # E2E integration tier — contract tests that pin protocol-level
      # invariants across packages (e.g. MCP multi-replica session
      # locality, #2069). Runs in-process via mock.module(), no Docker
      # services needed. Cross-package imports require all SDK dists
      # (same set as test-others above — cheaper to build all four than
      # to discover the dependency drift via a CI failure).
      - name: Build SDK packages
        run: bun run build:sdk

      - name: Test (e2e integration tier)
        run: bun run test:e2e:integration

  # Umbrella required-check for branch protection.
  #
  # Branch protection on `main` requires a single context named `ci`. The
  # umbrella `needs:` EVERY job in this workflow — including the api-tests
  # shards and ee-stub-build, which historically sat outside it as five
  # separate required contexts (`api-tests (1/4)`–`(4/4)`, `Symlink Stub
  # Build`). Folding them in means the shard count and the stub job are
  # workflow-internal details: resharding 4→6 no longer requires a branch
  # protection edit, and the required-contexts list shrinks to `ci` alone
  # for this workflow. Migration notes + the trim command:
  # docs/development/branch-protection.md. `if: always()` so the check is
  # present even when a dependent job fails.
  #
  # `needs.<job>.result` aggregates a matrix: `api-tests` and `mutation-tables`
  # are each `success` only if all four shards succeeded. Neither is a required
  # context by name — only `ci` is — so renaming their shards cannot strand
  # branch protection. ee-stub-build may legitimately be `skipped`
  # (path-gated on the `changes` job — docs-only PRs); everything else must
  # be `success`, including `changes` itself.
  ci:
    name: ci
    needs: [changes, drift, gate-fixtures, lint, lint-type-aware, type, build, test-others, test-e2e-integration, api-tests, mutation-tables, ee-stub-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all dependent jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DRIFT_RESULT: ${{ needs.drift.result }}
          GATE_FIXTURES_RESULT: ${{ needs.gate-fixtures.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          LINT_TYPE_AWARE_RESULT: ${{ needs.lint-type-aware.result }}
          TYPE_RESULT: ${{ needs.type.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_OTHERS_RESULT: ${{ needs.test-others.result }}
          TEST_E2E_RESULT: ${{ needs.test-e2e-integration.result }}
          API_TESTS_RESULT: ${{ needs.api-tests.result }}
          MUTATION_TABLES_RESULT: ${{ needs.mutation-tables.result }}
          EE_STUB_RESULT: ${{ needs.ee-stub-build.result }}
        run: |
          set -euo pipefail
          fail=0
          for pair in "changes=$CHANGES_RESULT" "drift=$DRIFT_RESULT" "gate-fixtures=$GATE_FIXTURES_RESULT" "lint=$LINT_RESULT" "lint-type-aware=$LINT_TYPE_AWARE_RESULT" "type=$TYPE_RESULT" "build=$BUILD_RESULT" "test-others=$TEST_OTHERS_RESULT" "test-e2e-integration=$TEST_E2E_RESULT" "api-tests=$API_TESTS_RESULT" "mutation-tables=$MUTATION_TABLES_RESULT"; do
            name=${pair%%=*}
            result=${pair#*=}
            if [ "$result" != "success" ]; then
              echo "::error::$name job result was '$result' (expected 'success')"
              fail=1
            fi
          done
          # ee-stub-build is path-gated: skipped means the diff was docs-only
          # and structurally cannot have introduced a core → ee import.
          if [ "$EE_STUB_RESULT" != "success" ] && [ "$EE_STUB_RESULT" != "skipped" ]; then
            echo "::error::ee-stub-build job result was '$EE_STUB_RESULT' (expected 'success' or 'skipped')"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All CI gates passed."

  mutation-tables:
    # The generated mutation tables (packages/api/scripts/mutations/*.md) must
    # equal what re-running their specs produces (#5077). `mutate.ts --check`
    # existed from #5060 and nothing ran it, so FOUR of eight were stale on
    # `main` — including mutation-core.md, the runner's own table, whose
    # `escapeCell` row had been a dead ANCHOR since #5060/#4389 rewrote the
    # escape it pointed at.
    #
    # ⚠️ Its OWN job rather than a step in `api-tests`, which would run the sweep
    # once per api-tests shard.
    #
    # This job is NOT free. The old justification was that `Built image (docs)`
    # took ~25 minutes anyway, so the sweep ran inside someone else's critical
    # path. That job lives in image-scan.yml as `built-images`, path-gated on
    # Dockerfiles / package.json / bun.lock / deploy/, so it skips on most PRs.
    #
    # Measured 2026-08-14 via `gh api repos/AtlasDevHQ/atlas/actions/runs/<id>/jobs`.
    # When the sweep is at `--all` — every push to main, plus a PR touching a
    # spec's targets — it ran 15.6 and 18.4 min (pushes 31826451943, 31825282540)
    # and 15.9 and 31.0 min (PR #5222, runs 31825661154, 31822641685), against
    # ~3.7-4.2 for the next slowest job (`drift`, `test-others`). On a PR that
    # touches no spec, `--affected` selects nothing and this job is under a
    # minute. So the cost is real but concentrated: this sets the wall clock
    # exactly when it widens.
    #
    # Sharded by ROW. `--shard I/N` verifies every spec `--affected`/`--all`
    # selected, but each shard measures only the rows at positions ≡ I-1
    # (mod N) within each spec and reads the rest back from the committed
    # table, so the scope is unchanged and the comparison stays whole-file.
    # Each shard repeats the selection pass (git plumbing plus `mutate.ts
    # --files`, cheap) and every selected spec's baselines (one suite run per
    # target, the price of guardrail 1 being per-process); only the mutation
    # runs are divided.
    #
    # Rows, not specs, because cost tracks a spec's row count times its suites'
    # runtime and a round-robin over specs ignored both. Measured on the
    # push-to-main sweep at c67841ae2 (run 33937489562): 1916s of measurement
    # over 344 rows across 15 specs, `warehouse-producer` alone 437s, so the
    # long pole was 633s against a 319s ideal — and no arrangement of whole
    # specs could go under the heaviest one. Re-read the job timings on the
    # next push to `main` before quoting a number for the row-level split.
    #
    # `ci-local.sh` still runs the `--affected` subset unsharded: one machine,
    # and a full sweep added to a ~10-minute pre-PR loop is how a gate gets
    # deleted.
    #
    # There is deliberately no `timeout-minutes` here: a sweep killed halfway
    # reports nothing while looking like a verdict. Without one, a sweep that
    # outgrows the runner shows up as a slow job rather than a red gate.
    name: mutation-tables (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: a stale table on one shard must not cancel the other
      # three. A cancelled shard reports nothing, and nothing beside a real
      # failure reads as "one table drifted" when four might have.
      fail-fast: false
      matrix:
        # ⚠️ The ONLY place the shard count is written. The divisor passed to
        # `--shard` comes from `strategy.job-total`, so resharding is this one
        # edit. An earlier cut hardcoded `/4` in the job name and both run-step
        # invocations: growing the matrix then failed loudly ("index exceeds
        # total"), but SHRINKING it silently orphaned every spec at the dropped
        # positions — verified by nobody, four green jobs — which is the same
        # defect the round-robin exists to prevent, moved from spec names to a
        # hand-copied integer.
        #
        # SIX since 2026-08-26, chosen under the spec-level partition as the
        # point where six shards reached the floor set by the heaviest single
        # spec. With rows partitioned that floor is gone; what bounds the gain
        # now is the per-shard fixed cost (~50s of checkout, install, builds and
        # selection, plus every spec's baselines, ~70s of suite runs measured on
        # the same sweep). Eight would trade four more runners and Postgres
        # services for roughly a minute. Re-measure before changing this.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history: `--affected` diffs against the PR base SHA, which is
          # not reachable from a shallow clone. The script widens to `--all` if
          # the diff fails, so a shallow clone would silently cost ~16 minutes
          # rather than break — which is exactly the failure nobody notices.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build @useatlas/types + @useatlas/plugin-sdk
        run: bun run build:sdk:core

      - name: Verify the generated mutation tables
        env:
          # Required, not optional: several specs target *-pg.test.ts, which
          # self-skip without it. The runner refuses a baseline that skipped
          # anything, so an absent URL fails this job loudly rather than
          # regenerating zeros over real measurements.
          TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          SHARD_JOB_INDEX: ${{ strategy.job-index }}
        run: |
          set -euo pipefail
          # ⚠️ The SWEEP still happens — it MOVED, it was not deleted. #5077's
          # finding was that four of eight tables were stale on `main` because
          # `--check` existed and nothing ran it; `push: main` below is what
          # keeps that closed. What changed is only WHEN a full sweep blocks:
          # not on a PR whose diff cannot have touched a table. `--affected`
          # widens to `--all` on any unresolvable diff, so the narrow path can
          # never silently verify nothing.
          #
          # The label must agree with the position the runner actually assigned,
          # or `shard: [1, 1, 2]` would type-check as a matrix and leave one
          # residue class unowned while every job went green.
          #
          # ⚠️ Check that job-index is a NUMBER first. `set -u` does not catch a
          # set-but-empty variable in arithmetic — bash reads it as 0 — so an
          # empty job-index made shard 1 pass this assertion and reddened only
          # shards 2-4, with a message blaming the wrong thing. Same class as the
          # `[ 1x -gt 4 ]` bug: a malformed value read as a passing value.
          if ! [[ "$SHARD_JOB_INDEX" =~ ^[0-9]+$ ]] || ! [[ "$SHARD_TOTAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::strategy.job-index / job-total did not render as numbers (got '$SHARD_JOB_INDEX' / '$SHARD_TOTAL')"
            exit 1
          fi
          if [ "$SHARD" != "$((SHARD_JOB_INDEX + 1))" ]; then
            echo "::error::matrix.shard $SHARD does not match job-index $SHARD_JOB_INDEX + 1"
            exit 1
          fi
          # Announce WHICH MODE ran, in the step summary rather than only in the
          # log. This job is bimodal and the two modes differ by ~13x -- measured
          # 2026-08-26 across 12 runs: 50-57s when `--affected` selects nothing,
          # 660-690s on `--all`. Both are normal, but the job list shows only a
          # duration, so the slow mode reads as the job "randomly" hanging. The
          # script already prints "N of M spec(s) affected by this branch" -- this
          # puts the reason where someone scanning the checks will see it.
          #
          # Written BEFORE the run, deliberately: a summary emitted afterwards is
          # lost on the failure path, which is when the reason matters most.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "shard $SHARD/$SHARD_TOTAL — \`--affected\` against \`$BASE_SHA\`: only specs whose targets this branch touched. Expect well under a minute unless the diff reaches one." >> "$GITHUB_STEP_SUMMARY"
            bash scripts/check-mutation-tables.sh --affected "$BASE_SHA" --shard "$SHARD/$SHARD_TOTAL"
          else
            echo "shard $SHARD/$SHARD_TOTAL — \`--all\`: the full sweep, which is what keeps #5077 closed on every push. Expect ~10 minutes." >> "$GITHUB_STEP_SUMMARY"
            bash scripts/check-mutation-tables.sh --all --shard "$SHARD/$SHARD_TOTAL"
          fi
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  # ⚠️ READING A RED api-tests JOB (#5395)
  #
  # A preempted shard and a slow one look identical in the GitHub UI, and the
  # distinction is the one everyone gets wrong first: the JOB conclusion is
  # `failure` either way, but a preempted shard's TEST STEP conclusion is
  # `cancelled` — usually with `The runner has received a shutdown signal` /
  # `The operation was canceled` and zero `(fail)` lines. Check the step, not
  # the job:
  #
  #   gh api repos/AtlasDevHQ/atlas/actions/runs/<run>/jobs \
  #     --jq '.jobs[]|select(.name|startswith("api-tests"))|
  #           "\(.name) job=\(.conclusion) \([.steps[]|select(.name|startswith("Test"))|.conclusion]|join(","))"'
  #
  # `cancelled` step  -> runner loss. Re-run; the suite is not the cause.
  # `failure` step    -> a real failing assertion. Read the log.
  #
  # Deliberately NO `timeout-minutes` here: a cap would convert an ambiguous
  # cancellation into a definite one and destroy exactly this signal.
  #
  # History: this ran at 11.8% of CI runs losing an api-tests job (14/119 runs,
  # 9 of them outright runner loss, 11/14 concentrated on the long-pole shard
  # 1/4). Regenerating test-timings.json (#5383, landed #5397) flattened the
  # shard spread from 2.52x to ~1.2x, and the re-take over the following 166
  # runs measured 3.0% (5 runs) with ZERO cancelled test steps — every survivor
  # a genuine assertion failure. If this climbs again, compare the LONGEST
  # shard, whichever number it now carries: a rebalance moves which files sit
  # where, so the label is not stable across one.
  api-tests:
    name: api-tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # @useatlas/types and @useatlas/plugin-sdk both resolve to their
      # `dist/` via their "exports" field, so api tests can't import them
      # until the packages have been built. plugin-sdk is required because
      # `description-rubric.test.ts` imports `@useatlas/yaml-context`,
      # which imports `@useatlas/plugin-sdk` for the plugin contract.
      - name: Build @useatlas/types + @useatlas/plugin-sdk
        run: bun run build:sdk:core

      - name: Test @atlas/api (shard ${{ matrix.shard }}/4)
        working-directory: packages/api
        env:
          # Postgres service container exposed on localhost:5432 — the
          # migration smoke test (`migrate-pg.test.ts`) runs every
          # migration end-to-end against a real Postgres so SQL
          # semantic errors (the 0054 class) fail CI instead of prod
          # boot. Tests skip cleanly when this env var is unset, so
          # local-dev runs without `bun run db:up` are unaffected.
          TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas
        # Native `bun test --parallel` (bun 1.4). `--parallel` implies `--isolate`:
        # a fresh global + module registry per FILE, which is what the deleted
        # custom runner was buying with a subprocess per file.
        #
        # ⚠️ Do NOT add `--no-isolate` for speed. It lets a worker keep one global
        # across the files it runs, and `agent-compaction.test.ts` is known to
        # leak module state across same-process runs (it false-fails under
        # `--rerun-each`, which shares a process, while passing 12/12 under
        # `--parallel`). `--no-isolate` would make that leak routine.
        #
        # `--timings` balances the four shards by measured duration instead of
        # round-robin file index. On the committed data that is a 1.96x -> 1.00x
        # skew (critical path 550s -> 373s of serial work). The file is advisory:
        # if it goes stale, sharding degrades to unbalanced but stays CORRECT.
        #
        # ## Regenerating it (#5383)
        #
        # ⚠️ **NOT with the bare `--update-timings` command this comment used to
        # name.** A developer box is the wrong instrument twice over: with
        # `TEST_DATABASE_URL` set the local `-pg` sweep hangs on Postgres
        # contention and still writes a half-measured file, and without it the
        # `-pg` suites skip in milliseconds and record as the FASTEST files in
        # the suite. Either input produces a balancer worse than a stale one.
        #
        # Run the workflow instead — it measures on RUNNERS, one file per shard,
        # and merges the four disjoint maps:
        #
        #   gh workflow run test-timings-refresh.yml --ref <branch>
        #
        # It opens (or force-updates) a PR from `ci/test-timings-refresh` with
        # the merged file and the line below; merge it. It also runs monthly on
        # a schedule, and whenever the `shard-balance` job below fires.
        #
        # LAST REGENERATED: 2026-09-04 run 33936592365 main 7931c4eb5 (workflow_dispatch)
        #
        # ⚠️ The line above is MACHINE-OWNED. test-timings-refresh.yml rewrites
        # everything after the colon and stops if it finds the prefix zero or
        # several times, so keep it one line and put history here instead.
        # History: 2026-09-04 (#5647) because #5644 folded 121 test files and
        # shard 2/4 was running 170s against 82s for 3/4; 2026-08-23 (run
        # 32650149461, #5397); before that never — every number was a
        # measurement of the suite as it stood at #2802, roughly two thousand
        # commits earlier.
        #
        # Drift is MEASURED, not eyeballed. `shard-balance` reads this step's
        # wall time across the last ten green `main` runs and fails when the
        # heaviest shard's median exceeds the lightest's by 1.5x. Why a median
        # and why 1.5x — a single run ranges 1.1x..2.4x on an unchanged tree —
        # is in `.github/scripts/measure-shard-spread.ts`.
        #
        # A refresh that ran without a database would produce a well-formed
        # file in which the heaviest suites are the lightest entries. The merge
        # step refuses it (measured `-pg` median must clear 500ms, in
        # merge-test-timings.ts), so the artifact and the PR have already
        # passed the read this comment used to ask for by hand.
        #
        # ⚠️ A rebalance does NOT fix a PREEMPTED shard. `The runner has received
        # a shutdown signal` and `The operation was canceled` are runner loss;
        # the test step's conclusion is `cancelled` even though the job's is
        # `failure`, and no distribution of file durations touches it. If shard
        # 1/4 keeps failing after a refresh, read #5383's comment before
        # concluding the refresh was insufficient.
        run: bun test --parallel --shard=${{ matrix.shard }}/4 --timings=scripts/test-timings.json
    services:
      # Postgres for the real-Postgres suites. Each matrix leg is its own
      # runner and gets its own service container — shards do NOT share this
      # Postgres, so cross-shard interference is not a thing. Contention is
      # always *within* a shard, between the `-pg` suites the runner happens
      # to have in flight concurrently; those scope their writes to a private
      # scratch schema, and the migration advisory lock is keyed to that schema
      # so they no longer serialize against each other (#4844).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
  # Post-merge measurement, `main` only: is the api-tests balancer still
  # balancing? Reads this run's four test-step durations plus the last nine
  # green `main` runs' and fails when the heaviest shard's MEDIAN exceeds the
  # lightest's by 1.5x, then dispatches test-timings-refresh.yml, which opens
  # the PR that fixes it. The statistic and the threshold are argued in the
  # script; the short version is that one run is one runner's mood.
  #
  # Not in the `ci` umbrella's `needs`, deliberately: it never runs on a PR
  # (there is no green-`main` history to read on a merge ref), and on `main`
  # a red here is the signal — it stays red until the refresh PR merges, and
  # no push is blocked by it. `actions: write` is what `gh workflow run`
  # needs; the reads it also covers.
  shard-balance:
    name: shard-balance
    needs: api-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.api-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install: "false"

      - name: Collect api-tests durations from this run and the last nine green main runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/spread
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --paginate --slurp > /tmp/spread/current.json
          gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
            --limit 9 --json databaseId --jq '.[].databaseId' \
          | while read -r id; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" \
                --paginate --slurp > "/tmp/spread/${id}.json"
            done
          ls /tmp/spread

      - name: Fail when the shard spread has drifted
        id: spread
        run: bun .github/scripts/measure-shard-spread.ts --threshold 1.5 --min-runs 5 /tmp/spread/*.json

      - name: Dispatch a timings refresh
        # Only on the spread step's own failure — a collection error above is
        # not drift. One open refresh PR at a time: while it waits, every main
        # push would otherwise burn four runners re-measuring the same tree.
        if: failure() && steps.spread.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --head ci/test-timings-refresh --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "a refresh PR is already open from ci/test-timings-refresh; not dispatching another sweep"
            exit 0
          fi
          gh workflow run test-timings-refresh.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "dispatched test-timings-refresh.yml on main"

  ee-stub-build:
    # Proof that core (packages/api/src/) has zero structural coupling
    # to ee/. Replaces ee/ with a minimal stub exposing only
    # @atlas/ee/layers#EELayer (Layer.empty) and runs type-check + build
    # against the core. Closes the 1.5.1 architecture-deepening arc
    # (#2017 / milestone #48); any regression that re-introduces a
    # core → ee import beyond the one allowed boot-time composition
    # file (lib/effect/enterprise-layer.ts) fails this job.
    #
    # Path-gated on the `changes` job: a docs-only diff cannot introduce a
    # core → ee import, so the ~2 min re-typecheck+rebuild skips. The `ci`
    # umbrella accepts `skipped` here — and since the 2026-07-30 contexts
    # trim, `ci` is the ONLY thing enforcing this job; the standalone
    # `Symlink Stub Build` required context is gone. Renaming this job or
    # removing it from the umbrella's `needs:` silently drops the
    # core-compiles-standalone gate. See docs/development/branch-protection.md.
    name: Symlink Stub Build
    needs: changes
    if: needs.changes.outputs.ee-stub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # install: "false" — this job installs AFTER swapping ee/ for the stub,
      # and without --frozen-lockfile (see the install step below).
      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install: "false"

      - name: Replace ee/ with stub
        run: |
          set -euo pipefail
          rm -rf ee
          cp -R scripts/ee-stub ee
          echo "Stub contents:"
          find ee -type f | sort

      - name: Install dependencies (refresh workspace symlinks)
        # Intentionally NOT --frozen-lockfile: the stub package.json has a
        # smaller dependency surface than the real ee/, so bun.lock changes
        # are expected and ephemeral to this job.
        run: bun install

      - name: Type check (core compiles standalone)
        run: bun run type

      - name: Build (core bundles standalone)
        run: bun run build

