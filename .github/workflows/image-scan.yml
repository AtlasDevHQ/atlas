name: Image Scan

# Container-image vulnerability scanning (#4822).
#
# ── What this covers that nothing else did ────────────────────────────────────
#
# CodeQL analyses source. Dependabot watches manifests. Neither one sees a
# vulnerable OS package baked into a runtime layer — that was the gap, and it is
# the gap this workflow closes. Atlas ships eight Dockerfiles, several of them
# customer-facing scaffolds, so a base-image CVE propagates into every project
# scaffolded from a template.
#
# ── Policy ────────────────────────────────────────────────────────────────────
#
# Threshold and unfixed-CVE handling live in scripts/scan-image.sh, next to the
# flags that implement them; the baseline and its expiry dates live in
# .trivyignore. Read those two files for the reasoning. In short:
#
#   blocks    fixable HIGH/CRITICAL in OS packages, minus the dated
#             .trivyignore baseline (which is NOT empty — read that file for
#             what is in it and why each entry is legitimate)
#
#             ⚠️ WHERE it blocks is not symmetric, and #5361 is the reason.
#             The BUILT-image tier is the gate of record on every trigger: it
#             reads the finished artifact, which is the only thing a customer
#             receives. The BASE-image tier is report-only except on a base
#             reference the PR introduced or changed. Absolute base gating
#             protected nothing that ships — all eight runtime stages upgrade
#             their OS packages — while blocking PRs that touched no image at
#             all. scripts/base-image-gate.sh holds that policy.
#   reports   every FIXABLE finding at every severity and package type, from the
#             BUILT images only, via SARIF to GitHub code scanning
#   logs      everything else, unfixed included, as a census in the job log
#
# ⚠️ Two reporting narrowings landed 2026-08-12, both measured. Together they
# took code scanning from ~1,059 open alerts to a readable set, and neither
# removed a unique finding:
#
#   base-image legs no longer upload SARIF. Of their 113 unique CVEs, ZERO were
#   absent from the built-image scans — the base set IS the set of bases those
#   images are built from. They still GATE, and they still provide the
#   discovery property that an enumerated list of built images cannot.
#
#   unfixed CVEs no longer become alerts. 116 of 272 unique CVEs had no
#   published fix, so no version to move to and no decision to record. They are
#   printed in full to the job log instead. See scripts/scan-image.sh.
#
# Two things deliberately do not block:
#
#   Unfixed CVEs, because a gate that is red for something nobody can action
#   gets ignored, and an ignored gate reads as coverage while providing none.
#
#   Library findings (npm, Go modules) inside the images. #4822 scoped these out
#   on the premise that "Dependabot already owns them and can open the fix PR."
#   That premise was false and is corrected here (#4878): Atlas uses bun, and
#   `bun` is a SEPARATE Dependabot ecosystem from `npm` that does NOT support
#   security updates. Dependabot will not open a fix PR for an npm advisory in
#   this repo, no matter how it is configured — so for the whole window between
#   #4822 and #4878 this scanner was the only thing looking, while its own header
#   said something else owned it.
#
#   The handoff that actually exists now:
#
#     detection      Trivy here, against the image's resolved node_modules —
#                    the authoritative surface, since that is what ships
#     visibility     .github/workflows/dependency-graph.yml submits the resolved
#                    bun.lock closure via the Dependency Submission API, which
#                    is what makes Dependabot ALERTS fire on transitive packages.
#                    The dependency graph does not parse bun.lock on its own
#     remediation    hand-authored `overrides` in the root package.json, plus
#                    parent bumps where a parent pins a vulnerable version
#     freshness      the `/deps-update` skill, run by hand: `bun update` plus
#                    `bun x syncpack fix`. NOT Dependabot. A `bun` version-updates
#                    config lived at .github/dependabot.yml briefly (#4884) and was
#                    removed in #4890: its grouped PRs could not pass the REQUIRED
#                    `drift` gate. `drift` runs `syncpack lint`, which compares
#                    create-atlas/templates/*/package.json — and those sit outside
#                    root `workspaces`, so a Dependabot run rooted at "/" can never
#                    reach them. Every weekly sweep touching a template-shared dep
#                    went red. `deps:update` clears that by construction with its
#                    `syncpack fix` pass; Dependabot has no way to run one
#
#   They still do not block, but for a different reason than #4822 gave: the
#   remediation path is manual, and part of the residual set has no expressible
#   fix. bun supports only TOP-LEVEL overrides, so a package present at two
#   majors (undici 6.x + 7.x, brace-expansion 2.x + 5.x) cannot be pinned
#   per-major — a single global override silently forces every consumer onto one
#   version. Gating on findings nobody can action is the same trap as gating on
#   unfixed CVEs, one bullet up. The residual set and the reason each entry is
#   declined are recorded on #4878.
#
#   protobufjs was listed here as a third two-major case and no longer is
#   (#4889, 2026-07-30). The override constraint was real but the lever was
#   misidentified: `protobufjs@8.0.1` came from ten NESTED
#   `@daytonaio/sdk/**/otlp-transformer@0.217.0` entries, not from our own OTel
#   pins — `otlp-transformer` dropped protobufjs in 0.218.0 and ours were
#   already `^0.218.0`, so bumping root OTel would have cleared nothing.
#   Bumping `@daytonaio/sdk` to `^0.201.0` (its OTel pins move to 0.220.0)
#   removed the 8.x copy outright, so no per-major override is needed. Only
#   `protobufjs@7.6.2` remains, via `@grpc/proto-loader` <- `@grpc/grpc-js`;
#   the prototype-pollution advisories were fixed in 7.2.5, so it is expected
#   to be clean — confirm against the live findings rather than assuming, and
#   if 7.6.2 IS flagged it needs a `@grpc/grpc-js` bump, a separate change.
#
# ── Where it runs, and why ────────────────────────────────────────────────────
#
# Two tiers, because the two kinds of target cost very different amounts:
#
#   base-images   Pull-and-scan the runtime base of every Dockerfile in the
#                 tree, discovered rather than enumerated. ~1-2 min, so it runs
#                 on EVERY pull request. This is the only tier that can cover
#                 the create-atlas templates, examples/docker, and the sidecar:
#                 those Dockerfiles cannot be built standalone in CI (they need
#                 a scaffolded project as build context), but their runtime base
#                 layer is exactly where OS CVEs live. Report-only unless the PR
#                 introduced or changed the reference (#5361).
#
#   built-images  Build deploy/api, deploy/web and deploy/docs and scan the
#                 finished artifacts. Catches what Atlas adds on top of the
#                 base — apt packages in the runner stages, the resolved
#                 production node_modules. ~8-10 min, so it is path-gated to
#                 PRs that can plausibly change image content.
#
# The weekly schedule is the tier that matters most and is easy to overlook: our
# base images are pinned by digest, so their content never changes, but the
# vulnerability database changes daily. A PR-triggered-only gate would never
# notice that a pinned image acquired a CRITICAL last Tuesday. The cron is what
# turns this from a change-detector into actual monitoring — and since #5361 it
# is also the tier that OWNS that case outright, rather than sharing it with a
# PR-time base gate that duplicated its job with merge-blocking power attached.
#
# One guard sits underneath all of this: scripts/check-runtime-stage-upgrades.sh.
# "A base CVE does not reach a shipped artifact" is only true while every
# runtime stage upgrades its packages, and that is the one property this
# workflow's narrowing makes weaker rather than stronger.

on:
  pull_request:
    branches: [main, "milestone/**"]
  push:
    branches: [main, "milestone/**", "hotfix/**"]
  schedule:
    # Mondays 07:00 UTC. Catches CVEs disclosed against unchanged, digest-pinned
    # base images — the case no push or PR event will ever surface.
    - cron: "0 7 * * 1"
  # Manual lever, mirroring ci.yml: lets an operator re-run the scan against a
  # specific SHA (notably a hotfix branched off the tag prod serves, which no
  # pull_request ever validates).
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned with a checksum rather than installed via a third-party action: this
  # workflow's whole job is supply-chain hygiene, so it should not widen the
  # supply chain to do it. Bump both values together.
  TRIVY_VERSION: "0.72.0"
  TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"

jobs:
  # Does this PR touch anything that could change what is inside a built image?
  # Mirrors the gating style in deploy-validation.yml, including its fail-safe:
  # if the diff cannot be computed, run everything.
  changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    outputs:
      built-images: ${{ steps.filter.outputs.built-images }}
      base-images: ${{ steps.discover.outputs.images }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      # Emitted as a matrix so each base image gets its own job. Splitting them
      # is parallelism now that this tier no longer uploads SARIF, but the
      # `label` still matters: it names the check, and it drops the digest
      # because a digest-pinned ref makes an unreadable check name.
      #
      # Each entry also carries `gated`, which is the whole of #5361. The base
      # tier does not block on the absolute CVE state of a base image on ANY
      # trigger — it blocks only on a base REFERENCE this PR introduced or
      # changed. scripts/base-image-gate.sh owns that policy and the reasoning;
      # read its header rather than a second copy here.
      - id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Off a pull_request there is no "what did this change introduce" to
          # ask, so nothing here gates. That is not a gap: `push: main`,
          # `schedule` and `workflow_dispatch` all run the BUILT-image tier
          # unconditionally, and that tier reads the artifact a customer
          # actually receives.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            MATRIX="$(bash scripts/base-image-gate.sh matrix --mode report-only)"
            echo "images=$MATRIX" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ⚠️ OUTSIDE the repo checkout on purpose. A merge-base worktree
          # placed under $GITHUB_WORKSPACE would be walked by the head tree's
          # own Dockerfile discovery, so every base ref would appear in both
          # sets and NOTHING would ever read as new.
          BASE_TREE="$(mktemp -d)"
          if git worktree add --detach "$BASE_TREE" "$BASE_SHA" >/dev/null 2>&1; then
            MATRIX="$(bash scripts/base-image-gate.sh matrix --mode diff --base-tree "$BASE_TREE")"
            git worktree remove --force "$BASE_TREE" || true
          else
            # Fail safe, and the direction is deliberate: an unknown baseline
            # means "we cannot tell what is new", whose only safe reading is
            # "all of it is". Report-only here would turn a checkout failure
            # into a silently ungated PR.
            echo "::warning::could not check out the merge-base tree ($BASE_SHA) — gating every base ref"
            MATRIX="$(bash scripts/base-image-gate.sh matrix --mode gate-all)"
          fi
          echo "images=$MATRIX" >> "$GITHUB_OUTPUT"

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Everything except a pull_request scans in full: pushes to main are
          # the last chance before an artifact reaches Railway, and the cron and
          # manual runs exist precisely to scan an unchanged tree.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "built-images=true" >> "$GITHUB_OUTPUT"
            echo "Event is $EVENT_NAME — scanning built images unconditionally"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>&1); then
            echo "::warning::git diff failed: $CHANGED — defaulting to a full scan"
            echo "built-images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Broad, but no longer "everything". ⚠️ This filter opened with
          # `^packages/`, which matches essentially every code PR in the repo —
          # so the ~10-min build+scan of three images ran on a one-line edit to
          # a test file under packages/api/src. That is not a broad filter, it
          # is an absent one, and it is what put this job on every PR's critical
          # path.
          #
          # What this gate detects is a vulnerable OS package in a runtime
          # layer, plus library findings in the image's resolved node_modules.
          # A TypeScript edit under packages/ changes NEITHER: it is compiled
          # into a layer above the base, and the dependency closure Trivy reads
          # is decided by the lockfile and the manifests. So the trigger set is
          # the things that can actually move those two surfaces —
          #
          #   any Dockerfile        base image pin, layer contents, apt/apk installs
          #   any package.json      a manifest anywhere in the workspace graph
          #   bun.lock              the resolved closure that ships
          #   deploy/               the three images that are actually built here
          #   the scanner itself    scripts + baseline + this file — named one
          #                         by one, because `^scripts/` would put a
          #                         ~10-min three-image build on every edit to
          #                         any of the dozens of unrelated files in that
          #                         directory. ⚠️ That makes it a HAND-MAINTAINED
          #                         list, and #5361 had to extend it with three
          #                         names: scripts/base-image-gate.sh,
          #                         scripts/check-runtime-stage-upgrades.sh and
          #                         scripts/lib/dockerfile-stages.sh. A future
          #                         scanner script not added here is not a hole,
          #                         but it is a DELAY: the built images are then
          #                         first scanned against it by the
          #                         unconditional `push: main` run, one merge
          #                         later, rather than on the PR
          #
          # ⚠️ `(^|/)` on the file-name patterns, not `^`: the old `package\.json$`
          # was anchored to the ROOT manifest alone, so a workspace package
          # gaining a dependency was matched only by the `^packages/` blanket
          # this narrowing removes. Dropping the blanket without widening these
          # would have opened a real hole.
          #
          # The residual is bounded by design, and by two backstops already in
          # this file: `push: main` scans unconditionally (the early return
          # above) — the last chance before an artifact reaches Railway — and
          # the Monday cron scans an unchanged tree, which is the only thing
          # that ever catches a CVE disclosed against a digest-pinned base.
          # PR-time scanning is early warning, not the gate of record.
          if echo "$CHANGED" | grep -qE '^(deploy/|create-atlas/templates/docker/|examples/docker/|\.trivyignore$|scripts/(scan-image|list-runtime-base-images|base-image-gate|check-runtime-stage-upgrades)\.sh$|scripts/lib/dockerfile-stages\.sh$|\.github/workflows/image-scan\.yml$)|(^|/)Dockerfile|(^|/)package\.json$|(^|/)bun\.lock$'; then
            echo "built-images=true" >> "$GITHUB_OUTPUT"
            echo "Image-relevant paths changed — scanning built images"
          else
            echo "built-images=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant paths changed — base-image scan only"
          fi

  # Prove the gate can actually go red, and that it is not merely red.
  #
  # #4822 called this out explicitly: a green run against a currently-clean tree
  # proves nothing. scripts/__tests__/scan-image.test.sh builds a deliberately
  # vulnerable image and asserts scan-image.sh exits 1 on it, builds a
  # package-free image and asserts it exits 0, and checks that the .trivyignore
  # baseline suppresses the gate WITHOUT suppressing the SARIF report.
  #
  # Since #5361 it also breaks the TREE, not just the image: it bumps a base pin
  # to a worse one, adds a Dockerfile on a base the tree never carried, and adds
  # a runtime stage with no upgrade — then reads what the real decision code
  # says. Those three are what stop "report-only for an unchanged ref" from
  # quietly becoming "report-only".
  #
  # It runs before the real scans and gates them: if the scanner has silently
  # stopped detecting anything (a bad Trivy bump, a broken flag, an over-broad
  # baseline), a green scan of the real images is meaningless and should not be
  # reported as a pass.
  gate-self-test:
    name: Gate self-test (vulnerable fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}
          sha256: ${{ env.TRIVY_SHA256 }}
      - name: Adversarial fixtures for the image-scan gate (#4822)
        run: bash scripts/__tests__/scan-image.test.sh

  # The premise the base tier's report-only mode stands on (#5361).
  #
  # Every runtime stage in the tree upgrades its OS packages, which is why a CVE
  # in an unchanged base is not a fact about anything Atlas ships. A runtime
  # stage that skips the upgrade falsifies that AND is invisible to both tiers:
  # an unchanged base ref is not gated here, and only three of the eight
  # Dockerfiles are in the built-images matrix.
  #
  # Cheap (pure bash, no docker, no trivy) and unconditional, because the thing
  # it guards is the reason the expensive tiers are allowed to be quiet.
  runtime-stage-upgrades:
    name: Runtime stages upgrade OS packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Every runtime stage runs apt-get upgrade / apk upgrade (#5361)
        run: bash scripts/check-runtime-stage-upgrades.sh

  # Tier 1 — runtime base images, discovered from every Dockerfile in the tree.
  #
  # ⚠️ This tier does NOT report to code scanning (changed 2026-08-12) and it
  # does NOT gate on absolute CVE state (changed by #5361). It is report-only
  # except on a base reference the PR introduced or changed. Two narrowings,
  # different reasons, both measured — do not collapse them.
  #
  # Why it still exists: DISCOVERY. scripts/list-runtime-base-images.sh resolves
  # the runtime stage of EVERY Dockerfile in the tree, so a new Dockerfile with
  # a base nobody remembered to scan enters this matrix automatically. The three
  # built images below are an enumerated list and cannot do that. Deleting this
  # job to silence its alerts would have traded a real coverage property for a
  # number.
  #
  # Why the SARIF upload went away, measured rather than assumed:
  #
  #   1. It was near-total duplication. Of the 113 unique CVEs these legs
  #      reported, ZERO were absent from the built-image scans AT THE TIME —
  #      measured before the 2026-08-12 runner-stage upgrades landed.
  #
  #      ⚠️ That measurement is STALE as a subset claim and must not be cited as
  #      a visibility guarantee (#5361). The upgrades in (2) mean the built
  #      images now carry FEWER findings than their bases, so the base set is a
  #      strict SUPERSET, not a subset: a bare-base CVE the upgrade clears is
  #      reported by nothing. That is correct — the finding is not a fact about
  #      Atlas's artifacts — but it is the opposite of what "ZERO were absent"
  #      implies. What must stay visible is what SURVIVES the upgrade, and that
  #      is the built-image tier's SARIF, which does upload.
  #
  #      The cost the removal saved was real: ~396 of the ~1,059 open alerts,
  #      because code scanning needs a distinct category per upload and
  #      therefore counted the same base-layer CVE once per image.
  #
  #   2. Since 2026-08-12 it is also WRONG. All eight runtime stages in the tree
  #      run `apt-get upgrade` / `apk upgrade`, so a scan of the bare base
  #      reports packages that do not ship — it overstates the shipped surface.
  #      The built-image scan is the only one that reads the artifact a customer
  #      actually receives. scripts/check-runtime-stage-upgrades.sh is what keeps
  #      that premise true.
  #
  # What the gate does now, replacing the sentence that used to sit here — "this
  # job still fails on a fixable HIGH/CRITICAL OS package in a base, which is
  # what catches a bad pin on the PR that makes it". The stated intent was
  # regression; the implementation was absolute state, and the two are different
  # checks. #5361 makes the behaviour match the sentence: it fails only on a base
  # REFERENCE this PR introduced or changed, which is exactly "a bad pin on the
  # PR that makes it" plus the new-Dockerfile-on-a-new-base case that is the same
  # event seen through the ref set. Policy and reasoning:
  # scripts/base-image-gate.sh.
  base-images:
    name: Base image (${{ matrix.image.label }})
    needs: [changes, gate-self-test]
    runs-on: ubuntu-latest
    # No `security-events: write` — nothing here uploads any more. Kept minimal
    # on purpose: if a future edit re-adds an upload step it will fail loudly on
    # the missing permission rather than quietly re-inflating the alert count.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.base-images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}
          sha256: ${{ env.TRIVY_SHA256 }}

      - name: Scan ${{ matrix.image.ref }}
        env:
          IMAGE: ${{ matrix.image.ref }}
          CATEGORY: base-${{ matrix.image.label }}
          GATED: ${{ matrix.image.gated }}
        run: bash scripts/base-image-gate.sh scan "$IMAGE" "$CATEGORY" "$GATED" trivy-results

  # Tier 2 — the images Atlas builds and deploys, scanned as finished artifacts.
  # Since #5361 this is the GATE OF RECORD on every trigger, which raises the bar
  # on one thing that used to be merely wasteful: the build cache.
  #
  # ⚠️ THE UPGRADE LAYER MUST NOT COME FROM CACHE. `RUN apt-get update &&
  # apt-get upgrade -y` has a stable command string and a stable parent layer, so
  # buildx cache-hits it forever — and the scan then reads a runner stage
  # upgraded against whatever the security repo held the day that layer was first
  # built. Measured on #5361's first CI run:
  #
  #   #68 [runner 2/6] RUN apt-get update && apt-get upgrade -y … CACHED
  #
  # and the resulting web image carried the four util-linux CVEs that a fresh
  # local build of the same commit did not. `.trivyignore` had been masking it,
  # so "ZERO gate-blocking findings in all three" was a fact about a fresh build
  # and not about the artifact this job actually scanned.
  #
  # `no-cache-filters` below rebuilds the runner stage every run and leaves the
  # expensive deps/builder stages cached. The stage NAME is load-bearing —
  # a rename would match no stage and silently restore the staleness — so each
  # leg asserts it before building.
  built-images:
    name: Built image (${{ matrix.name }})
    needs: [changes, gate-self-test]
    if: needs.changes.outputs.built-images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/api/Dockerfile
            # Shares the gha cache scope deploy-validation.yml's boot-build and
            # boot-smoke jobs populate, so on a PR where those run this build is
            # warm rather than a third full build of the same tree.
            cache-scope: boot-smoke
            runtime-stage: runner
          - name: web
            dockerfile: deploy/web/Dockerfile
            cache-scope: image-scan-web
            runtime-stage: runner
          - name: docs
            dockerfile: deploy/docs/Dockerfile
            cache-scope: image-scan-docs
            runtime-stage: runner
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Before the build, because a wrong name here does not fail the build —
      # it silently produces a stale artifact and a green scan of it.
      - name: '${{ matrix.runtime-stage }} is the final stage of ${{ matrix.dockerfile }}'
        run: bash scripts/check-runtime-stage-upgrades.sh --assert-runtime-stage "${{ matrix.dockerfile }}" "${{ matrix.runtime-stage }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The whole point is scanning the resolved runtime layers, so the
          # final stage must be built and loaded — a `target: builder` build
          # would scan layers that never ship and miss the ones that do.
          load: true
          tags: atlas-${{ matrix.name }}:image-scan
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          # The runtime stage rebuilds every run so its OS-package upgrade is
          # actually re-run — see the ⚠️ on this job. Everything below it stays
          # cached, so this costs the runner stage, not the build.
          no-cache-filters: ${{ matrix.runtime-stage }}
          # mode=min: only the final-stage layers. Writing intermediates here
          # would duplicate what boot-build already pushes to the shared scope
          # and cost several minutes per run (see deploy-validation.yml).
          cache-to: type=gha,scope=${{ matrix.cache-scope }},mode=min

      - uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}
          sha256: ${{ env.TRIVY_SHA256 }}

      - name: Scan ${{ matrix.name }} image
        run: bash scripts/scan-image.sh atlas-${{ matrix.name }}:image-scan built-${{ matrix.name }} trivy-results

      - name: Upload SARIF to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: trivy-results/built-${{ matrix.name }}.sarif
          category: built-${{ matrix.name }}

  # Umbrella check, mirroring `deploy-validation-required`. Always runs, so a
  # single stable context name is present on every PR even when the matrix job
  # skips — which is what branch protection needs to be able to require it.
  image-scan-required:
    name: Image Scan
    needs: [changes, gate-self-test, runtime-stage-upgrades, base-images, built-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all dependent jobs succeeded or were skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELFTEST_RESULT: ${{ needs.gate-self-test.result }}
          UPGRADES_RESULT: ${{ needs.runtime-stage-upgrades.result }}
          BASE_RESULT: ${{ needs.base-images.result }}
          BUILT_RESULT: ${{ needs.built-images.result }}
        run: |
          set -euo pipefail
          fail=0
          # These four run unconditionally. A `skipped` among them means the
          # gate was bypassed rather than satisfied, which must not read green.
          for pair in "changes=$CHANGES_RESULT" "gate-self-test=$SELFTEST_RESULT" "runtime-stage-upgrades=$UPGRADES_RESULT" "base-images=$BASE_RESULT"; do
            name=${pair%%=*}
            result=${pair#*=}
            if [ "$result" != "success" ]; then
              echo "::error::$name job result was '$result' (expected 'success')"
              fail=1
            fi
          done
          # built-images is path-gated; skipping is a legitimate outcome on a PR
          # that cannot have changed image content.
          if [ "$BUILT_RESULT" != "success" ] && [ "$BUILT_RESULT" != "skipped" ]; then
            echo "::error::built-images job result was '$BUILT_RESULT' (expected 'success' or 'skipped')"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All image-scan gates passed (or properly skipped)."
