name: Image Scan

# Container-image vulnerability scanning (#4822).
#
# ── What this covers that nothing else did ────────────────────────────────────
#
# CodeQL analyses source. Dependabot watches manifests. Neither one sees a
# vulnerable OS package baked into a runtime layer — that was the gap, and it is
# the gap this workflow closes. Atlas ships eight Dockerfiles, several of them
# customer-facing scaffolds, so a base-image CVE propagates into every project
# scaffolded from a template.
#
# ── Policy ────────────────────────────────────────────────────────────────────
#
# Threshold and unfixed-CVE handling live in scripts/scan-image.sh, next to the
# flags that implement them; the baseline and its expiry dates live in
# .trivyignore. Read those two files for the reasoning. In short:
#
#   blocks    fixable HIGH/CRITICAL in OS packages, minus the dated
#             .trivyignore baseline
#   reports   everything else, unfiltered — every severity, unfixed CVEs, and
#             language dependencies — via SARIF to GitHub code scanning
#
# Two things deliberately do not block:
#
#   Unfixed CVEs, because a gate that is red for something nobody can action
#   gets ignored, and an ignored gate reads as coverage while providing none.
#
#   Library findings (npm, Go modules) inside the images. #4822 scoped these out
#   on the premise that "Dependabot already owns them and can open the fix PR."
#   That premise was false and is corrected here (#4878): Atlas uses bun, and
#   `bun` is a SEPARATE Dependabot ecosystem from `npm` that does NOT support
#   security updates. Dependabot will not open a fix PR for an npm advisory in
#   this repo, no matter how it is configured — so for the whole window between
#   #4822 and #4878 this scanner was the only thing looking, while its own header
#   said something else owned it.
#
#   The handoff that actually exists now:
#
#     detection      Trivy here, against the image's resolved node_modules —
#                    the authoritative surface, since that is what ships
#     visibility     .github/workflows/dependency-graph.yml submits the resolved
#                    bun.lock closure via the Dependency Submission API, which
#                    is what makes Dependabot ALERTS fire on transitive packages.
#                    The dependency graph does not parse bun.lock on its own
#     remediation    hand-authored `overrides` in the root package.json, plus
#                    parent bumps where a parent pins a vulnerable version
#     freshness      the `/deps-update` skill, run by hand: `bun update` plus
#                    `bun x syncpack fix`. NOT Dependabot. A `bun` version-updates
#                    config lived at .github/dependabot.yml briefly (#4884) and was
#                    removed in #4890: its grouped PRs could not pass the REQUIRED
#                    `drift` gate. `drift` runs `syncpack lint`, which compares
#                    create-atlas/templates/*/package.json — and those sit outside
#                    root `workspaces`, so a Dependabot run rooted at "/" can never
#                    reach them. Every weekly sweep touching a template-shared dep
#                    went red. `deps:update` clears that by construction with its
#                    `syncpack fix` pass; Dependabot has no way to run one
#
#   They still do not block, but for a different reason than #4822 gave: the
#   remediation path is manual, and part of the residual set has no expressible
#   fix. bun supports only TOP-LEVEL overrides, so a package present at two
#   majors (undici 6.x + 7.x, brace-expansion 2.x + 5.x, protobufjs 7.x + 8.x)
#   cannot be pinned per-major — a single global override silently forces every
#   consumer onto one version. Gating on findings nobody can action is the same
#   trap as gating on unfixed CVEs, one bullet up. The residual set and the
#   reason each entry is declined are recorded on #4878.
#
# ── Where it runs, and why ────────────────────────────────────────────────────
#
# Two tiers, because the two kinds of target cost very different amounts:
#
#   base-images   Pull-and-scan the runtime base of every Dockerfile in the
#                 tree, discovered rather than enumerated. ~1-2 min, so it runs
#                 on EVERY pull request. This is the only tier that can cover
#                 the create-atlas templates, examples/docker, and the sidecar:
#                 those Dockerfiles cannot be built standalone in CI (they need
#                 a scaffolded project as build context), but their runtime base
#                 layer is exactly where OS CVEs live.
#
#   built-images  Build deploy/api, deploy/web and deploy/docs and scan the
#                 finished artifacts. Catches what Atlas adds on top of the
#                 base — apt packages in the runner stages, the resolved
#                 production node_modules. ~8-10 min, so it is path-gated to
#                 PRs that can plausibly change image content.
#
# The weekly schedule is the tier that matters most and is easy to overlook: our
# base images are pinned by digest, so their content never changes, but the
# vulnerability database changes daily. A PR-triggered-only gate would never
# notice that a pinned image acquired a CRITICAL last Tuesday. The cron is what
# turns this from a change-detector into actual monitoring.

on:
  pull_request:
    branches: [main, "milestone/**"]
  push:
    branches: [main, "milestone/**", "hotfix/**"]
  schedule:
    # Mondays 07:00 UTC. Catches CVEs disclosed against unchanged, digest-pinned
    # base images — the case no push or PR event will ever surface.
    - cron: "0 7 * * 1"
  # Manual lever, mirroring ci.yml: lets an operator re-run the scan against a
  # specific SHA (notably a hotfix branched off the tag prod serves, which no
  # pull_request ever validates).
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned with a checksum rather than installed via a third-party action: this
  # workflow's whole job is supply-chain hygiene, so it should not widen the
  # supply chain to do it. Bump both values together.
  TRIVY_VERSION: "0.72.0"
  TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"

jobs:
  # Does this PR touch anything that could change what is inside a built image?
  # Mirrors the gating style in deploy-validation.yml, including its fail-safe:
  # if the diff cannot be computed, run everything.
  changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    outputs:
      built-images: ${{ steps.filter.outputs.built-images }}
      base-images: ${{ steps.discover.outputs.images }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      # Emitted as a matrix so each base image gets its own job — and, more to
      # the point, its own SARIF upload. GitHub code scanning rejects multiple
      # SARIF runs sharing one category, so a single job uploading a directory
      # of reports fails; one image per matrix leg gives each a distinct
      # category for free.
      # Each entry carries both the full ref (what gets scanned) and a short
      # label (what names the check and the SARIF category). The label drops the
      # digest: a digest-pinned ref makes an unreadable check name, and the
      # category must stay stable across a digest bump or code scanning treats
      # the same image as a brand-new analysis and never closes its old alerts.
      - id: discover
        run: |
          set -euo pipefail
          IMAGES="$(bash scripts/list-runtime-base-images.sh)"
          echo "Runtime base images discovered:"
          echo "$IMAGES" | sed 's/^/  /'
          MATRIX="$(printf '%s' "$IMAGES" | jq -R -s -c '
            split("\n") | map(select(length > 0)) | map({
              ref: .,
              label: (. | split("@")[0] | gsub("[/:]"; "-"))
            })')"
          echo "Matrix: $MATRIX"
          echo "images=$MATRIX" >> "$GITHUB_OUTPUT"

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Everything except a pull_request scans in full: pushes to main are
          # the last chance before an artifact reaches Railway, and the cron and
          # manual runs exist precisely to scan an unchanged tree.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "built-images=true" >> "$GITHUB_OUTPUT"
            echo "Event is $EVENT_NAME — scanning built images unconditionally"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>&1); then
            echo "::warning::git diff failed: $CHANGED — defaulting to a full scan"
            echo "built-images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Deliberately broad. A false positive costs ~10 min of parallel CI; a
          # false negative ships an unscanned image. bun.lock and package.json
          # are included because the resolved production dependency tree is part
          # of the image, and Trivy scans it.
          if echo "$CHANGED" | grep -qE '^(deploy/|packages/|plugins/|ee/|apps/docs/|create-atlas/templates/docker/|examples/docker/|bun\.lock$|package\.json$|\.trivyignore$|scripts/(scan-image|list-runtime-base-images)\.sh$|\.github/workflows/image-scan\.yml$)'; then
            echo "built-images=true" >> "$GITHUB_OUTPUT"
            echo "Image-relevant paths changed — scanning built images"
          else
            echo "built-images=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant paths changed — base-image scan only"
          fi

  # Prove the gate can actually go red, and that it is not merely red.
  #
  # #4822 called this out explicitly: a green run against a currently-clean tree
  # proves nothing. scripts/__tests__/scan-image.test.sh builds a deliberately
  # vulnerable image and asserts scan-image.sh exits 1 on it, builds a
  # package-free image and asserts it exits 0, and checks that the .trivyignore
  # baseline suppresses the gate WITHOUT suppressing the SARIF report.
  #
  # It runs before the real scans and gates them: if the scanner has silently
  # stopped detecting anything (a bad Trivy bump, a broken flag, an over-broad
  # baseline), a green scan of the real images is meaningless and should not be
  # reported as a pass.
  gate-self-test:
    name: Gate self-test (vulnerable fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}
          sha256: ${{ env.TRIVY_SHA256 }}
      - name: Adversarial fixtures for the image-scan gate (#4822)
        run: bash scripts/__tests__/scan-image.test.sh

  # Tier 1 — runtime base images, discovered from every Dockerfile in the tree.
  #
  # One matrix leg per image. Splitting them is not just parallelism: code
  # scanning refuses multiple SARIF runs under one category, so each image needs
  # its own upload with its own category anyway.
  base-images:
    name: Base image (${{ matrix.image.label }})
    needs: [changes, gate-self-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.base-images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}
          sha256: ${{ env.TRIVY_SHA256 }}

      - name: Scan ${{ matrix.image.ref }}
        env:
          IMAGE: ${{ matrix.image.ref }}
          CATEGORY: base-${{ matrix.image.label }}
        run: bash scripts/scan-image.sh "$IMAGE" "$CATEGORY" trivy-results

      - name: Upload SARIF to code scanning
        # `always()` so findings are still triageable when the gate failed —
        # that is exactly when someone needs to look at them. Fork PRs cannot
        # write security events, so skip rather than fail the job on a
        # permissions error that says nothing about the code.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: trivy-results/base-${{ matrix.image.label }}.sarif
          category: base-${{ matrix.image.label }}

  # Tier 2 — the images Atlas builds and deploys, scanned as finished artifacts.
  built-images:
    name: Built image (${{ matrix.name }})
    needs: [changes, gate-self-test]
    if: needs.changes.outputs.built-images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/api/Dockerfile
            # Shares the gha cache scope deploy-validation.yml's boot-build and
            # boot-smoke jobs populate, so on a PR where those run this build is
            # warm rather than a third full build of the same tree.
            cache-scope: boot-smoke
          - name: web
            dockerfile: deploy/web/Dockerfile
            cache-scope: image-scan-web
          - name: docs
            dockerfile: deploy/docs/Dockerfile
            cache-scope: image-scan-docs
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The whole point is scanning the resolved runtime layers, so the
          # final stage must be built and loaded — a `target: builder` build
          # would scan layers that never ship and miss the ones that do.
          load: true
          tags: atlas-${{ matrix.name }}:image-scan
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          # mode=min: only the final-stage layers. Writing intermediates here
          # would duplicate what boot-build already pushes to the shared scope
          # and cost several minutes per run (see deploy-validation.yml).
          cache-to: type=gha,scope=${{ matrix.cache-scope }},mode=min

      - uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}
          sha256: ${{ env.TRIVY_SHA256 }}

      - name: Scan ${{ matrix.name }} image
        run: bash scripts/scan-image.sh atlas-${{ matrix.name }}:image-scan built-${{ matrix.name }} trivy-results

      - name: Upload SARIF to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: trivy-results/built-${{ matrix.name }}.sarif
          category: built-${{ matrix.name }}

  # Umbrella check, mirroring `deploy-validation-required`. Always runs, so a
  # single stable context name is present on every PR even when the matrix job
  # skips — which is what branch protection needs to be able to require it.
  image-scan-required:
    name: Image Scan
    needs: [changes, gate-self-test, base-images, built-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all dependent jobs succeeded or were skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELFTEST_RESULT: ${{ needs.gate-self-test.result }}
          BASE_RESULT: ${{ needs.base-images.result }}
          BUILT_RESULT: ${{ needs.built-images.result }}
        run: |
          set -euo pipefail
          fail=0
          # These three run unconditionally. A `skipped` among them means the
          # gate was bypassed rather than satisfied, which must not read green.
          for pair in "changes=$CHANGES_RESULT" "gate-self-test=$SELFTEST_RESULT" "base-images=$BASE_RESULT"; do
            name=${pair%%=*}
            result=${pair#*=}
            if [ "$result" != "success" ]; then
              echo "::error::$name job result was '$result' (expected 'success')"
              fail=1
            fi
          done
          # built-images is path-gated; skipping is a legitimate outcome on a PR
          # that cannot have changed image content.
          if [ "$BUILT_RESULT" != "success" ] && [ "$BUILT_RESULT" != "skipped" ]; then
            echo "::error::built-images job result was '$BUILT_RESULT' (expected 'success' or 'skipped')"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All image-scan gates passed (or properly skipped)."
