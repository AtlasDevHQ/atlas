name: Canonical Eval (LLM)

# The real-model half of the canonical eval, split out of eval.yml (2026-08-10).
#
# WHY IT IS ITS OWN WORKFLOW
#   `on.pull_request.paths` is WORKFLOW-scoped in GitHub Actions — there is no
#   per-job path filter. While this job shared eval.yml with the two
#   deterministic jobs, it fired on their trigger paths too, and it is the only
#   one of the three that spends money.
#
#   Measured over the 90 days to 2026-08-10: 210 of 1800 merges to `main` would
#   have triggered eval.yml. 136 of those 210 were triggered SOLELY by
#   `packages/api/src/lib/semantic/**` (80) and `packages/api/src/lib/auth/server.ts`
#   (56) — paths that belong to `canonical-eval` (SQL correctness) and
#   `canonical-mcp-eval` (the JWT/OAuth path) respectively. Both of those jobs
#   are FREE. This job grades tool_selection / recovery / latency, which are
#   properties of the MCP TOOL SURFACE, and neither of those paths is it.
#
#   So the paths below are the tool surface and this eval's own harness, and
#   nothing else. A semantic-layer or auth change still gets full coverage from
#   the two deterministic jobs in eval.yml; it just stops buying LLM calls that
#   have nothing to say about it.
#
#   Measured against the same 90 days: 210 triggering merges under the old
#   shared list, 54 under the list below — a 74% cut, with coverage kept on
#   every PR where this eval has diagnostic power. Roughly 216 paid PR runs a
#   year rather than 840, plus 52 scheduled and ~12 tag.
#
# WHY THE WEEKLY SCHEDULE
#   ⚠️ The drift this eval exists to catch is MODEL-SIDE. A provider changes a
#   model's behaviour and no PR of ours touches any path — so a path trigger
#   structurally cannot see it, and a tag trigger sees it only if we happen to
#   release. The cron is the trigger that matches the failure mode, and its cost
#   is bounded and independent of PR volume: 52 runs a year.
#
#   A scheduled run is not a `pull_request`, so `eval-informational-gate.sh`
#   takes its non-PR branch — the workflow goes RED on `main` rather than
#   posting a comment. That is deliberate: a drift alarm nobody is looking at
#   has to be visible on its own.
#
# COST, and it is NOT the number this job's comment used to claim
#   The old comment said "under $0.05 per run". That was never measured — the
#   job had never executed. Its first real run (2026-08-10, local, on the
#   gateway) was 20 questions / 124 tool calls / 429s of model wall-clock: an
#   order of magnitude more work than $0.05 of Haiku buys.
#
#   ⚠️ #5123 CLOSED THE MEASUREMENT GAP THIS BLOCK USED TO DESCRIBE. The eval now
#   records token usage per question and for the run — `usage.{inputTokens,
#   outputTokens,totalTokens}` plus `usage.unreported` in the `--json` payload,
#   and an `N in + M out = T total` line on stderr. So the figure is no longer
#   unknown in principle; it is unknown until a real run publishes one.
#
#   Read it OFF A RUN, not off arithmetic. Every dollar figure quoted for this
#   job before #5123 — including "under $0.05" above — was an estimate, and
#   #5039's spend decision wants the measured number from the artifact.
#
# POLICY — identical to eval.yml's, and the gate script is shared:
#   - Pull requests: informational but VISIBLE (green check + PR comment).
#   - Release tags and scheduled runs: blocking / red.
#   - A job that did NOT RUN fails the gate (#5040). `eval-mcp-llm` is the sole
#     entry on SKIP_TOLERANT_LABELS and only until #5039 wires the secret.
#
# Workflow-injection notes: no untrusted PR/issue/commit field is spliced into
# any `run:` string; the gate step forwards only `steps.*.outcome`, the PR
# number, and server-side run metadata via `env:`.

on:
  pull_request:
    branches: [main]
    paths:
      # The MCP tool surface — what tool_selection and recovery actually grade.
      - "packages/mcp/src/tools.ts"
      - "packages/mcp/src/semantic-tools.ts"
      - "packages/mcp/src/prompts.ts"
      - "packages/mcp/src/resources.ts"
      - "packages/mcp/src/error-envelope.ts"
      # Transport + dispatch the eval drives the surface through.
      - "packages/mcp/src/hosted.ts"
      - "packages/mcp/src/server.ts"
      - "packages/mcp/src/actor.ts"
      # A dependency bump here is exactly how the auth fixture broke (#5121 —
      # Better Auth's origin check keyed on NODE_ENV), so it stays a trigger
      # even though it is 8 sole triggers per 90 days.
      - "packages/mcp/package.json"
      # This eval's own harness and corpus.
      - "packages/mcp/src/eval/**"
      - "packages/mcp/src/__tests__/canonical-mcp-*.ts"
      - "packages/cli/bin/canonical-eval-mcp-llm.ts"
      - "packages/cli/bin/canonical-eval-run.ts"
      - "packages/cli/bin/canonical-eval-tool-selection.ts"
      # The four files that keep fd 1 clean for the `tee` below (#5126). A break
      # in any of them is invisible in the job's status — the eval passes and
      # the uploaded artifact is unparseable — so they are triggers even though
      # three of them are not "the eval's harness" in any other sense:
      # `eval-log-destination.ts` stamps the logger's destination,
      # `bin/atlas.ts` holds the import ORDER that stamp depends on,
      # `lib/logger.ts` is the switch that stamp sets, and `init.ts`'s
      # `seedDemoPostgres` is the third writer, called before every mode branch.
      - "packages/cli/bin/eval-log-destination.ts"
      - "packages/cli/bin/atlas.ts"
      - "packages/api/src/lib/logger.ts"
      - "packages/cli/src/commands/init.ts"
      - "eval/canonical-questions/**"
      # The published init flow the eval auth fixture drives.
      - "plugins/mcp/src/init/hosted.ts"
      - "plugins/mcp/src/init/index.ts"
      # ── The paraphrase eval's surface (#5041) ──
      # ⚠️ `on.pull_request.paths` is WORKFLOW-scoped (see the block at the top
      # of this file), so these four trigger `eval-mcp-llm` too. That costs
      # nothing: since #5156 its PR runs are gated behind the `run-llm-eval`
      # label, so on a PR touching only the paths below it is OFFERED and
      # SKIPPED. On a tag push and the Monday cron both jobs run regardless,
      # which is what they are for.
      - "packages/api/src/lib/brain/extract.ts"
      - "packages/cli/bin/brain-paraphrase-eval.ts"
      - "eval/brain-paraphrase/**"
      # This file, and the gate step it ends with.
      - ".github/workflows/eval-llm.yml"
      - "scripts/eval-informational-gate.sh"
  push:
    tags:
      - "v*.*.*"
  # Mondays, 06:00 UTC. Scheduled runs only ever fire on the default branch.
  schedule:
    - cron: "0 6 * * 1"
  # So a drift investigation does not have to wait for Monday.
  workflow_dispatch:

# ⚠️ COST CONTROL, and the numbers are measured rather than estimated.
#
# This is the only job in the repo that spends real money per run: 1.02M input
# + 15.9k output tokens for 20 questions, which at the gateway's blended rate
# (measured 2026-08-12: $26.80 / 26M tokens) is ~$1.05 A RUN. The "<$0.05/run"
# figure #5039 was filed with is off by ~20x.
#
# Without a concurrency group every push to an eval-surface PR paid in full,
# including runs already superseded. MEASURED over one 11-hour window: 12 runs,
# ~$13 — of which `fix/eval-lane-residual-defects` was 4 pushes to one PR and
# `chore/5039` was 2 (a force-push whose first run was billed to completion).
# Roughly HALF that window's spend was superseded work.
#
# `cancel-in-progress` is scoped to the ref, so it only ever kills a run whose
# commit is already stale. Tag pushes and the Monday cron get distinct groups
# from any PR and cannot cancel each other.
concurrency:
  group: eval-llm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # informational-gate PR comments only

env:
  BUN_VERSION: "1.3.13"

jobs:
  # LLM-driven MCP eval (#2119 Part B). Runs every canonical question
  # through the real hosted MCP route via an LLM (Vercel AI SDK
  # `streamText` + tools bound to MCP `tools/call`) and grades the
  # tool-call sequence per question.
  #
  # Catches regressions the typed evals cannot:
  #   - `tool_selection`: misleading tool descriptions route the LLM to
  #     the wrong tool for a known question.
  #   - `recovery`: the LLM ignores `unknown_*` / `ambiguous_term`
  #     envelopes instead of self-correcting.
  #   - `latency`: dispatch fan-out grows past the committed baseline
  #     by >25% (early-warning signal; baseline lives at
  #     `eval/canonical-questions/mcp-llm-baseline.json`).
  #
  # Needs a real datasource (the LLM may pick `executeSQL`) and an LLM
  # API key.
  #
  # ⚠️ THE CREDENTIAL IS THE VERCEL AI GATEWAY, NOT A DIRECT ANTHROPIC KEY,
  # and that is the point rather than a convenience. `providers.ts` routes
  # hosted/SaaS deployments through the gateway, so a direct
  # `ANTHROPIC_API_KEY` here would exercise a credential path production
  # does not use — a green eval over the wrong client, on a second bill,
  # with none of the gateway's spend and latency observability. The eval's
  # whole claim is "the real path works"; the transport is part of the path.
  # `ATLAS_MODEL` is therefore a GATEWAY model id (`<provider>/<model>`,
  # slash-and-dots), not Anthropic's dashed API id. See the COST block at
  # the top of this file for what a run actually costs, and for why that
  # number is still an estimate (#5123).
  #
  # AI_GATEWAY_API_KEY must be added as a repo secret by an org owner.
  # Until the secret is wired the job emits a `::warning::` line and the
  # eval is skipped — green on PRs and tag pushes alike, because this job
  # is the sole entry on the gate script's SKIP_TOLERANT_LABELS list. That
  # list is the whole exemption (#5040): every other job fails on a
  # skipped step. ⚠️ This job has never run IN CI — #5039 wires the secret,
  # and drops this job from the list in the same change, so that from then
  # on a skip means the key stopped working. It has now run LOCALLY exactly
  # once (2026-08-10), which is what found the auth fixture break (#5121)
  # and the 1/20 score (#5122); do not read a green CI check as evidence
  # this eval passes until one of those runs is a CI run. Once the secret
  # lands, tag pushes become blocking via the informational-gate step. The
  # preflight step
  # distinguishes an unset secret from an invalid/expired one so a
  # credential rotation doesn't masquerade as a "0/20 regression" on a
  # tag push.
  eval-mcp-llm:
    name: eval-mcp-llm (#2119 Part B)
    runs-on: ubuntu-latest
    # Same policy as the deterministic + JWT-path jobs — PRs
    # informational-but-visible, tag pushes blocking. A drop below the
    # 18/20 acceptance floor must not ship in a tag.
    #
    # ⚠️ PR RUNS ARE OPT-IN, BY LABEL. Every OTHER trigger — tag push, the
    # Monday cron, workflow_dispatch — runs unconditionally, so the release
    # gate and the drift check are untouched. Only the ~54/yr path-triggered
    # PR runs are gated, and they were the bulk of the spend (see the cost
    # note on `concurrency:` above: ~$1.05/run, measured).
    #
    # Opting in is one label — `run-llm-eval` — and it is worth reaching for
    # on any PR touching the MCP tool surface or this eval's own harness,
    # which is precisely when a pre-merge answer is load-bearing. The paths
    # filter still decides whether the job is OFFERED; the label decides
    # whether it SPENDS. A PR that skips it is not unguarded: the tag push
    # before release still blocks on the 18/20 floor.
    #
    # `github.event_name != 'pull_request'` is the first clause on purpose —
    # it short-circuits for tag/cron/dispatch, where `pull_request.labels`
    # does not exist and would evaluate to an empty set.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-llm-eval')
    timeout-minutes: 20
    # Bind the gateway key at the job level so step-level `if:`
    # expressions can read it via `env.AI_GATEWAY_API_KEY`. GitHub
    # Actions does NOT allow the `secrets` context inside step-level
    # `if:` expressions — that restriction is what trips the workflow
    # parser ("This run likely failed because of a workflow file
    # issue."). The job-level env binding is the canonical workaround.
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build @useatlas/types (resolves api imports)
        run: bun run --filter '@useatlas/types' build

      - name: Provision atlas_demo database
        env:
          PGPASSWORD: atlas
        run: |
          bun x wait-on tcp:127.0.0.1:5432 --timeout 60000
          psql -h 127.0.0.1 -U atlas -d atlas -c "CREATE DATABASE atlas_demo;"

      - name: Skip when AI_GATEWAY_API_KEY is not set
        # `env.AI_GATEWAY_API_KEY` is the job-level binding above; that
        # surface IS allowed in step-level `if:` (the `secrets` context
        # itself is not). When the secret is unset the binding evaluates
        # to the empty string — same skip behavior, valid expression.
        if: ${{ env.AI_GATEWAY_API_KEY == '' }}
        run: |
          echo "::warning::AI_GATEWAY_API_KEY not configured — skipping LLM eval. Add the repo secret to enable."
          echo "ATLAS_LLM_EVAL_SKIPPED=1" >> "$GITHUB_ENV"

      - name: Verify AI_GATEWAY_API_KEY is valid
        # Pre-flight catches the case the empty-string skip above
        # cannot: a secret IS set but rejected (expired, malformed,
        # billing suspended, rate-limited). Without this check the
        # eval runs end-to-end, every LLM call fails as a
        # `tool_selection` regression, and the run trips the
        # acceptance floor for the wrong reason — masquerading as a
        # real semantic-layer regression. A 30-second curl preflight
        # makes the failure mode unambiguous.
        #
        # A CHAT COMPLETION, not the catalog. `gateway-catalog.ts` fetches
        # `GET /v1/models` with no Authorization header at all — it is a
        # public list, so it answers 200 for a revoked key and would turn
        # this step into decoration. The one-token completion is the
        # cheapest call that actually presents the credential. Both arms
        # were verified against the live gateway before this step shipped:
        # 200 with a valid key, 401 with a bad one.
        id: preflight
        continue-on-error: true
        if: ${{ env.ATLAS_LLM_EVAL_SKIPPED != '1' }}
        env:
          ATLAS_MODEL: anthropic/claude-haiku-4.5
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/gateway.json -w "%{http_code}" \
            -H "Authorization: Bearer $AI_GATEWAY_API_KEY" \
            -H "content-type: application/json" \
            -d "{\"model\":\"$ATLAS_MODEL\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}" \
            https://ai-gateway.vercel.sh/v1/chat/completions)
          if [ "$code" != "200" ]; then
            echo "::error::AI_GATEWAY_API_KEY rejected by the Vercel AI Gateway (HTTP $code). Body:"
            cat /tmp/gateway.json
            echo "::error::Rotate the repo secret before re-running."
            exit 1
          fi
          echo "AI_GATEWAY_API_KEY preflight OK"

      - name: Run LLM-driven MCP canonical eval
        id: eval
        continue-on-error: true
        # Requires the preflight to have SUCCEEDED (not just "not skipped"):
        # a rejected key would otherwise burn the full 20-minute eval as
        # spurious tool_selection failures. When the key is unset the
        # preflight is skipped, so this skips too — both outcomes reach the
        # gate step, where `skipped` counts as a pass for THIS job only
        # (SKIP_TOLERANT_LABELS, #5040).
        if: ${{ steps.preflight.outcome == 'success' }}
        env:
          # Cheap-and-fast default: Haiku for the eval. Operators can
          # override at the workflow-dispatch level by setting these
          # at the job env: layer above. AI_GATEWAY_API_KEY is bound at
          # the job level so it's already in scope here.
          #
          # ⚠️ The model id is the GATEWAY spelling — `anthropic/claude-haiku-4.5`,
          # slash and dots — and NOT Anthropic's dashed API id
          # (`claude-haiku-4-5-20251001`), which the gateway does not serve.
          # Keep it identical to the preflight's `ATLAS_MODEL` above, or the
          # preflight validates a model the eval never runs.
          ATLAS_PROVIDER: gateway
          ATLAS_MODEL: anthropic/claude-haiku-4.5
          ATLAS_DATASOURCE_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas_demo
          # DATABASE_URL deliberately unset — the in-process auth fixture
          # short-circuits audit writes via `hasInternalDB() === false`.
        # JSON output captures full per-question artifacts (toolCalls,
        # finalText, response payloads) for the upload-artifact step
        # below — the human-readable summary truncates `finalText` and
        # would lose the recovery-class diagnostic data.
        #
        # ⚠️ THE `tee` CAPTURES fd 1 WHOLESALE, WHICH IS WHY THE DRIVER HAS TO
        # KEEP fd 1 CLEAN — this line cannot defend itself. Until #5126 it could
        # not: the driver wrote its banner and progress lines to fd 1 alongside
        # the payload, and the app logger's pino default destination is fd 1 too,
        # pretty-printed and COLOURIZED because the eval runs with `NODE_ENV`
        # unset (#5121). `eval-mcp-llm-output.json` had therefore never parsed,
        # and `eval-informational-gate.sh` never noticed because it reads
        # `steps.*.outcome` and never opens the file.
        #
        # Since #5126 stdout under `--json` is the payload and nothing else, and
        # the human transcript is on fd 2 — so it still reaches this step's log,
        # unpiped, while `tee` writes a file that parses. That is a property of
        # `packages/cli/bin/canonical-eval-run.ts` and
        # `packages/cli/bin/eval-log-destination.ts`, pinned by
        # `packages/cli/bin/__tests__/eval-json-stdout.test.ts`; nothing here
        # needed to change, and a `2>&1` added here would undo all of it.
        #
        # pipefail is load-bearing: the default step shell is `bash -e {0}`
        # (NO pipefail), so without it the step's outcome is `tee`'s exit 0
        # and a 0/20 eval run reads as success — which would neuter the
        # informational gate below on tag pushes.
        run: |
          set -o pipefail
          bun packages/cli/bin/atlas.ts canonical-eval --mcp-llm --json | tee eval-mcp-llm-output.json

      - name: Assert the eval artifact is valid JSON
        # ⚠️ THE ONLY CHECK THAT CAN SEE A WRITER WE DO NOT OWN. Everything else
        # guarding fd 1 for this command is a unit test or a source grep over
        # OUR modules — and #5126's third polluter was already one file further
        # out than the fix's author looked. The `--json` process also pulls in
        # `@atlas/api`, `@atlas/mcp`, better-auth, pino and pg through dynamic
        # imports; any of those can print to fd 1 (there is a `console.debug`
        # on an `@atlas/api` cache self-heal path today), and no grep over this
        # repo's eval modules would ever see it.
        #
        # It is also the check whose absence is the whole issue: the artifact
        # had never parsed, for its entire life, and nothing noticed, because
        # `eval-informational-gate.sh` reads `steps.*.outcome` and never opens
        # the file.
        #
        # ⚠️ `continue-on-error` + an outcome threaded into the gate step, NOT a
        # bare `exit 1`. Every other failure in this job routes through
        # `eval-informational-gate.sh`, which owns the policy at the top of this
        # file: informational-but-visible on PRs, blocking on tags. A step that
        # reddens the job directly would promote this eval to a blocking gate on
        # PRs — the thing #2025/#2074 declined — and worse, the gate would still
        # see `success success` and refresh its comment to ✅ beside a red check.
        #
        # ⚠️ NOT on `cancelled`. `always()` runs this after a job timeout too,
        # and a killed run leaves a half-written payload that fails `jq` — which
        # would report a truncation as an fd-1 polluter, naming one cause with
        # certainty and the wrong one.
        id: artifact
        continue-on-error: true
        if: ${{ always() && env.ATLAS_LLM_EVAL_SKIPPED != '1' && (steps.eval.outcome == 'success' || steps.eval.outcome == 'failure') }}
        env:
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
        run: |
          set -euo pipefail
          if [ ! -s eval-mcp-llm-output.json ]; then
            # Empty is only benign when the eval itself failed — then it died
            # before writing, and the gate reports that. An eval that exits 0
            # having written nothing means the `--json` emitter did not run,
            # which is a defect this step is exactly positioned to catch.
            if [ "$EVAL_OUTCOME" = "success" ]; then
              echo "::error::the eval exited 0 but wrote no payload to stdout — the --json emitter did not run."
              exit 1
            fi
            echo "::notice::eval-mcp-llm-output.json is absent or empty — the eval died before writing; see the eval step."
            exit 0
          fi
          if ! jq empty eval-mcp-llm-output.json 2>/tmp/jq-err; then
            echo "::error::eval-mcp-llm-output.json is not valid JSON. Either something wrote to stdout alongside the --json payload (#5126 — look for a console.* in a module the eval pulls in), or the payload is truncated. jq says:"
            cat /tmp/jq-err
            echo "First 400 bytes:"
            head -c 400 eval-mcp-llm-output.json
            exit 1
          fi
          bytes=$(wc -c < eval-mcp-llm-output.json)
          echo "eval-mcp-llm-output.json parses ($bytes bytes)"
          # ⚠️ THE CLIFF IS NOT HYPOTHETICAL AND `jq empty` ABOVE ONLY SEES IT
          # ONCE IT HAS ALREADY BITTEN. #5134 measured stdout truncation just
          # above 65536 bytes through a real shell pipe, and the payload was
          # 63024 — 2.5 KB of headroom that #5123 then spent some of on token
          # usage. A payload that truncates does not arrive short, it arrives
          # UNPARSEABLE, so the only useful signal is one that fires BEFORE.
          #
          # 61440 (60 KiB) is a warn, not a failure: a run with more failing
          # questions legitimately carries more artifacts, and turning that into
          # a red gate would block the eval for succeeding at its job. The point
          # is that the margin stops being a number someone measured once.
          if [ "$bytes" -gt 61440 ]; then
            echo "::warning::the --json payload is $bytes bytes, within 4 KB of the ~65536 stdout truncation cliff (#5134). It parses TODAY; a slightly larger run will not. Shrink what the payload carries per outcome before adding to it."
          fi

      - name: Upload eval artifacts on failure
        # Captured regardless of pass/fail so a baseline drift on a
        # green run is still inspectable; the retention budget is small
        # enough that this is cheap. Without this step the failure
        # bundle is stuck in the workflow run's stdout and lost the
        # moment a maintainer closes the tab.
        if: ${{ always() && env.ATLAS_LLM_EVAL_SKIPPED != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-mcp-llm-output
          path: eval-mcp-llm-output.json
          retention-days: 14
          if-no-files-found: warn

      - name: Informational gate (PR comment on failure; blocks tags)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
          # The artifact-parses check (#5126). The script takes N outcomes and
          # applies the same PR-comment / tag-blocking split to the set, so an
          # unparseable bundle is visible on a PR and blocking on a tag —
          # exactly like a failing eval. `skipped` is fatal by default there and
          # `eval-mcp-llm` is on SKIP_TOLERANT_LABELS, so the no-secret path is
          # unaffected.
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        # Both `skipped` (no AI_GATEWAY_API_KEY wired) and `success` pass —
        # the skip only because `eval-mcp-llm` is on the gate script's
        # SKIP_TOLERANT_LABELS list (#5040), and it emits a ::warning::
        # saying the run proved nothing. A failed preflight (rejected key)
        # or failed eval goes through the PR-comment / tag-blocking split
        # in the script.
        run: bash scripts/eval-informational-gate.sh eval-mcp-llm "$PREFLIGHT_OUTCOME" "$EVAL_OUTCOME" "$ARTIFACT_OUTCOME"

  # The claim-identity paraphrase eval (#5041, ADR-0037 §9). It drives the REAL
  # extractor over `eval/brain-paraphrase/messages.json` and compares what came
  # back against the committed recording in `extracted.json` — the fixture the
  # deterministic brain suite consumes.
  #
  # ⚠️ WHAT A RED RUN HERE MEANS, because it is not "the eval broke".
  # `packages/api/src/lib/brain/__tests__/paraphrase-identity.test.ts` asserts
  # what the identity layer does with the surfaces in that recording. So a drift
  # is a change to what the deterministic suite PROVES, arriving from outside the
  # repo — the model started phrasing a relationship differently. The fix is to
  # read the diff and regenerate as a reviewed commit (`--write`), never to
  # loosen the comparison.
  #
  # WHY IT IS ITS OWN JOB rather than steps on `eval-mcp-llm`
  #   Different failure surface and a different bill. `eval-mcp-llm` needs the
  #   hosted MCP route, an OAuth fixture and a seeded Postgres; this needs a
  #   model and nothing else — no database service, no auth server, no MCP
  #   transport. Folding them together would make a paraphrase drift wait on an
  #   auth fixture that has already broken this eval lane once (#5121), and make
  #   `eval-mcp-llm`'s 20-minute timeout the bound on a job that takes seconds.
  #
  # COST — the shape is stated, the dollar figure deliberately is NOT.
  #   The repo's rule after #5123: read it off a run, never off arithmetic. No
  #   run has published a number for this job, so none is claimed here. What IS
  #   known is the shape, and it bounds the answer far below the sibling above:
  #   twenty single-turn `generateObject` calls on ~40-token prompts, with no
  #   tool loop and no dispatch fan-out, against that job's measured 1.02M input
  #   tokens across 124 tool calls. That is why PR runs are NOT label-gated here
  #   while `eval-mcp-llm`'s are — but if a run ever publishes a figure that
  #   makes this look like the wrong call, gate it the same way rather than
  #   arguing with this comment.
  #
  # ⚠️ SKIP-FATAL FROM ITS FIRST RUN, with nothing to remember. It is absent from
  # `SKIP_TOLERANT_LABELS` in `scripts/eval-informational-gate.sh`, which is
  # empty and fail-closed by default — so a missing or rejected key reports a
  # non-run instead of a pass. That is the structural difference #5039 bought:
  # `eval-mcp-llm` was permanently green and never executed for the whole of its
  # life, because a gate that returns "pass" for a job that did not run consumes
  # the belief that the property is covered.
  eval-brain-paraphrase:
    name: eval-brain-paraphrase (#5041)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build @useatlas/types (resolves api imports)
        run: bun run --filter '@useatlas/types' build

      - name: Verify AI_GATEWAY_API_KEY is valid
        # The same one-token completion the job above pre-flights with, and for
        # the same reason: without it a rejected key runs the whole eval, every
        # extraction fails, and the run reports a total paraphrase regression —
        # a credential rotation wearing a model-drift costume. A chat completion
        # rather than the catalog, because `GET /v1/models` needs no
        # Authorization header and answers 200 for a revoked key.
        id: preflight
        continue-on-error: true
        env:
          ATLAS_MODEL: anthropic/claude-haiku-4.5
        run: |
          set -euo pipefail
          if [ -z "${AI_GATEWAY_API_KEY:-}" ]; then
            echo "::error::AI_GATEWAY_API_KEY is not set. This job is skip-fatal: a non-run is reported, not passed."
            exit 1
          fi
          code=$(curl -s -o /tmp/gateway-paraphrase.json -w "%{http_code}" \
            -H "Authorization: Bearer $AI_GATEWAY_API_KEY" \
            -H "content-type: application/json" \
            -d "{\"model\":\"$ATLAS_MODEL\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}" \
            https://ai-gateway.vercel.sh/v1/chat/completions)
          if [ "$code" != "200" ]; then
            echo "::error::AI_GATEWAY_API_KEY rejected by the Vercel AI Gateway (HTTP $code). Body:"
            cat /tmp/gateway-paraphrase.json
            echo "::error::Rotate the repo secret before re-running."
            exit 1
          fi
          echo "AI_GATEWAY_API_KEY preflight OK"

      - name: Run the paraphrase eval
        id: eval
        continue-on-error: true
        # Requires the preflight to have SUCCEEDED, not merely "not been
        # skipped" — a rejected key would otherwise spend the full corpus
        # producing failures that read as drift.
        if: ${{ steps.preflight.outcome == 'success' }}
        env:
          # Identical to the preflight's `ATLAS_MODEL`, or the preflight
          # validates a model the eval never runs. The GATEWAY spelling
          # (`<provider>/<model>`), never Anthropic's dashed API id.
          ATLAS_PROVIDER: gateway
          ATLAS_MODEL: anthropic/claude-haiku-4.5
        # ⚠️ `pipefail` is load-bearing: the default step shell is `bash -e {0}`
        # with NO pipefail, so without it the step's outcome would be `tee`'s
        # exit 0 and a fully drifted run would read as success — neutering the
        # gate below on tag pushes.
        #
        # The driver keeps fd 1 clean for exactly this pipe: it stamps
        # `ATLAS_LOG_STDERR=1` before the dynamic import that constructs pino's
        # logger, and writes its human transcript to fd 2 in every mode. A
        # `2>&1` added here would undo all of it.
        run: |
          set -o pipefail
          bun packages/cli/bin/brain-paraphrase-eval.ts --json | tee eval-brain-paraphrase-output.json

      - name: Assert the eval artifact is valid JSON
        # The only check that can see a writer we do not own (#5126). This
        # process pulls in `@atlas/api` through dynamic imports, and any module
        # on that graph can print to fd 1 without any grep over this repo's eval
        # modules ever seeing it. Routed through the gate rather than a bare
        # `exit 1` so an unparseable bundle keeps the same PR-visible /
        # tag-blocking split as every other failure here.
        id: artifact
        continue-on-error: true
        if: ${{ always() && (steps.eval.outcome == 'success' || steps.eval.outcome == 'failure') }}
        env:
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
        run: |
          set -euo pipefail
          if [ ! -s eval-brain-paraphrase-output.json ]; then
            if [ "$EVAL_OUTCOME" = "success" ]; then
              echo "::error::the eval exited 0 but wrote no payload to stdout — the --json emitter did not run."
              exit 1
            fi
            echo "::notice::no payload — the eval died before writing; see the eval step."
            exit 0
          fi
          if ! jq empty eval-brain-paraphrase-output.json 2>/tmp/jq-paraphrase-err; then
            echo "::error::eval-brain-paraphrase-output.json is not valid JSON — something wrote to stdout alongside the --json payload (#5126), or the payload is truncated. jq says:"
            cat /tmp/jq-paraphrase-err
            head -c 400 eval-brain-paraphrase-output.json
            exit 1
          fi
          echo "eval-brain-paraphrase-output.json parses ($(wc -c < eval-brain-paraphrase-output.json) bytes)"

      - name: Upload the recording diff
        # Uploaded on green runs too: the payload carries every fresh triple, so
        # a maintainer regenerating the fixture can read what the model said
        # without paying for a second run.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-brain-paraphrase-output
          path: eval-brain-paraphrase-output.json
          retention-days: 14
          if-no-files-found: warn

      - name: Informational gate (PR comment on failure; blocks tags)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: bash scripts/eval-informational-gate.sh eval-brain-paraphrase "$PREFLIGHT_OUTCOME" "$EVAL_OUTCOME" "$ARTIFACT_OUTCOME"
