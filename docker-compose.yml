# Local dev: Postgres + sandbox sidecar.
#   atlas       — Atlas internal DB (auth, audit, settings)
#   atlas_demo  — Demo analytics datasource (disposable, re-seedable)
#   sandbox     — Isolated container for explore tool (shell + Python execution)
#
# .env should have:
#   DATABASE_URL=postgresql://atlas:atlas@localhost:5432/atlas
#   ATLAS_DATASOURCE_URL=postgresql://atlas:atlas@localhost:5432/atlas_demo
#   ATLAS_SANDBOX_URL=http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    # `max_connections` default is 100; the repo has 87 `*-pg.test.ts` suites and
    # `bun test --parallel` runs them concurrently, several opening `max: 4` pools.
    # 300 is headroom, NOT a fix for anything: raising it was measured against the
    # local suite on 2026-08-24 and moved nothing (27 failures at 100, 29 at 300),
    # so whatever times those suites out at 60s is not the server's connection cap.
    #
    # ⚠️ The connection-cap theory is now REFUTED WITH A NUMBER, not just with a
    # null result. Sampling `pg_stat_activity` every 2s through a full 87-suite
    # `-pg` sweep (#5410, 2026-08-24) peaked at **43 connections — 33 active, 9
    # idle** against a cap of 300. The arithmetic that motivated this line
    # (87 suites x `max: 4` = 348 > 100) never happens: `bun test --parallel`
    # bounds concurrency at the CPU count, so at most ~32 suites hold pools at
    # once and the rest have not started. 100 would have been ample.
    #
    # Kept anyway because it is free and the value is not what was wrong — the
    # reasoning was. Do not read this line as a fix, and do not "fix" a slow
    # local suite by raising it further. #5410 records three more refuted
    # hypotheses, including `max_locks_per_transaction`, which a synthetic probe
    # made look causal (`53200 out of shared memory` at 32-way concurrency) and
    # which the real suite never reaches.
    #
    # 33 active backends is exactly `nproc` on the box that measured it — the
    # suite is CPU-bound, not connection-bound. Tracked at #5410.
    command: postgres -c max_connections=300
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/cli/data/init-demo-db.sql:/docker-entrypoint-initdb.d/00-init.sql
      - ./packages/cli/data/ecommerce.sql:/data/ecommerce.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  sandbox:
    build:
      context: .
      dockerfile: packages/sandbox-sidecar/Dockerfile
    ports:
      # Loopback only — the sidecar runs with auth disabled in local dev and
      # must never be reachable from other hosts on the network.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./semantic:/semantic:ro
    environment:
      SEMANTIC_DIR: /semantic
      # Local dev runs without a token; the sidecar fails closed otherwise, so
      # the no-auth mode requires this explicit opt-out. Production deploys must
      # set SIDECAR_AUTH_TOKEN on both the API and sandbox services instead.
      SIDECAR_AUTH_DISABLE: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
