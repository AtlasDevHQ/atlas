name: Lighthouse

# Marketing-surface Lighthouse budget (#2009). Runs on PRs that touch
# either of the two Next.js apps that produce visitor-facing surfaces
# (`apps/www` for `/` + `/pricing`, `packages/web` for `/demo`) or the
# config / workflow itself.
#
# First-month policy: every budget assertion in `lighthouserc.js` is
# `warn`-only and never fails a PR. The signal is the auto-posted PR comment —
# we want a few weeks of "is this stable on shared runners?" data before
# promoting any assertion to `error`.
#
# The JOB, however, can go red, and saying otherwise here was wrong: a build or
# server-start failure fails it, and so does a run where both Lighthouse steps
# ran and delivered no reports (`Verify reports landed`). `lighthouse` is not a
# required check either way, so neither blocks a PR.
#
# Workflow-injection notes (per the GitHub Actions hardening guide):
#   - No untrusted PR/issue/commit fields are ever spliced into `run:`
#     strings. Step `outcome`s are forwarded to the comment script via
#     `env:`, and the comment body is built server-side in JS only from
#     fields the workflow itself produced (manifest.json, JSON reports).
#   - The bun + lhci versions templated into `run:` are pulled from the
#     workflow's own `env:` block — repo-controlled, not attacker-controlled.

on:
  pull_request:
    paths:
      - "apps/www/**"
      - "packages/web/**"
      - "lighthouserc.js"
      - ".github/workflows/lighthouse.yml"

permissions:
  contents: read
  pull-requests: write

env:
  BUN_VERSION: "1.3.13"
  LHCI_VERSION: "0.15.1"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # @atlas/web's build needs the published-shape SDK packages at import
      # time — `@useatlas/types` resolves to its dist via package exports,
      # so without these the Next build fails on `cannot find module`.
      - name: Build SDK packages
        run: |
          bun run --filter '@useatlas/types' build
          bun run --filter '@useatlas/plugin-sdk' build
          bun run --filter '@useatlas/sdk' build
          bun run --filter '@useatlas/react' build

      - name: Build apps/www (static export)
        run: bun run --filter '@atlas/www' build

      - name: Build packages/web
        run: bun run --filter '@atlas/web' build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # `setsid` puts each server in its own process group so the cleanup
      # step's `kill -- -<PGID>` reaps the actual `next` / `serve.ts`
      # process plus any children. Using a plain `&` + `$!` would only
      # capture the wrapper PID; killing it leaves the real server alive.
      - name: Start apps/www on :8080
        run: |
          PORT=8080 setsid bun apps/www/serve.ts > /tmp/www.log 2>&1 < /dev/null &
          echo "WWW_PGID=$!" >> "$GITHUB_ENV"

      - name: Start packages/web on :3000
        run: |
          cd packages/web && PORT=3000 setsid bun x next start > /tmp/web.log 2>&1 < /dev/null &
          echo "WEB_PGID=$!" >> "$GITHUB_ENV"

      - name: Wait for servers
        run: |
          set -e
          for url in http://localhost:8080/health http://localhost:3000/demo; do
            echo "Waiting for $url ..."
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then
                echo "  ready"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::$url never came up; last 50 log lines:"
                tail -n 50 /tmp/www.log /tmp/web.log || true
                exit 1
              fi
              sleep 1
            done
          done

      # `lhci autorun` runs healthcheck → collect → assert → upload. The config
      # decides the URLs and presets; LH_FORM_FACTOR switches desktop ↔ mobile,
      # and also picks the `upload.outputDir` — each form factor writes its own
      # `lighthouse-reports/<form-factor>/` with a `manifest.json`.
      # `continue-on-error: true` so one form factor failing still lets the
      # comment step render the other one's table.
      #
      # `--failOnUploadFailure` is load-bearing, not belt-and-braces. Without
      # it, `autorun` prints `WARNING: upload command failed.` to stderr and
      # STILL EXITS 0 (`src/autorun/autorun.js`: the `process.exit(uploadStatus)`
      # is guarded on this very flag). Upload is the step that writes the
      # reports, so the one failure mode this workflow exists to notice —
      # reports not landing — otherwise produces a GREEN step, and the comment
      # then says "No reports found." instead of "Run failed.": #4899's exact
      # sentence, on a run that failed for a reason we had just been told.
      #
      # There is deliberately no "stash the reports" step between the two runs.
      # #4899 blamed one for losing them. It did not: `lhci collect` really does
      # write `lhr-*.json` into `.lighthouseci` (and `assert` adds
      # `assertion-results.json`), while `healthcheck` creates that directory
      # before `collect` even runs — so on any run where `autorun` actually
      # started, `[ -d .lighthouseci ]` was true and its `mv` fired.
      # The single file that was never there is `manifest.json`, which only the
      # `filesystem` upload target writes and which is the only file gating the
      # tables — without it no row renders at all, whatever else is on disk.
      # `lhci` now writes each form factor straight to its own
      # directory, so there is nothing to move and nothing to overwrite: the
      # mobile run's `collect` clears `.lighthouseci`, but desktop's reports
      # already live outside it.
      - name: Lighthouse (desktop)
        id: lh-desktop
        continue-on-error: true
        env:
          LH_FORM_FACTOR: desktop
        run: bun x @lhci/cli@${{ env.LHCI_VERSION }} autorun --failOnUploadFailure --config=./lighthouserc.js

      - name: Lighthouse (mobile)
        id: lh-mobile
        continue-on-error: true
        env:
          LH_FORM_FACTOR: mobile
        run: bun x @lhci/cli@${{ env.LHCI_VERSION }} autorun --failOnUploadFailure --config=./lighthouserc.js

      # #4899's whole failure mode was SILENCE: the reports were missing for
      # THREE MONTHS — the workflow landed 2026-05-02 and the defect shipped
      # with it, across 1200+ runs — and the only symptom was a PR comment
      # politely saying "No reports found", on a green workflow. This step exists
      # so that never reads as green again.
      #
      # It evaluates the same predicate the comment does — at least one manifest
      # entry with `isRepresentativeRun: true`, parsed rather than pattern-
      # matched. An earlier draft checked only that the directory and
      # `manifest.json` existed and that some `*.report.json` was present; a
      # `manifest.json` containing `[]` passes all three of those and still
      # renders the empty state, which is the #4899 shape one layer in.
      #
      # Escalation policy, deliberately narrow: a form factor missing its
      # reports is a `::warning::`, but BOTH missing is a plumbing failure and
      # exits non-zero — PROVIDED the Lighthouse steps actually ran. The gate on
      # `$ran` is load-bearing: this step is `if: always()` and nothing before
      # the Lighthouse steps carries `continue-on-error`, so a failed build or a
      # server that never came up reaches here with no reports at all. Escalating
      # there would stack a second red annotation on a run whose real signal is
      # the build failure, and blame it on a plumbing regression it is not.
      #
      # Failing here does not violate the first-month warn-only policy, which is
      # about budget ASSERTIONS: `lighthouse` is not currently a required check
      # (see `docs/development/branch-protection.md`), so a red run is visible
      # without blocking any PR. #4899 survived three months precisely because a
      # polite annotation under a green check goes unread.
      - name: Verify reports landed
        if: always()
        env:
          DESKTOP_OUTCOME: ${{ steps.lh-desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.lh-mobile.outcome }}
        run: |
          # Only `success` and `failure` mean the step executed. `skipped` and
          # `''` mean it never started, and `cancelled` means the job was torn
          # down — in none of those is a missing report this step's news.
          ran=0
          case "$DESKTOP_OUTCOME" in success|failure) ran=1 ;; esac
          case "$MOBILE_OUTCOME" in success|failure) ran=1 ;; esac

          landed=0
          for ff in desktop mobile; do
            dir="lighthouse-reports/$ff"
            if [ ! -d "$dir" ]; then
              echo "::warning::$dir does not exist — the $ff table will render its empty state"
              continue
            fi
            # Decoupled from lhci's `reportFilenamePattern` on purpose: matching
            # `*.report.json` would silently start counting 0 (and warning on
            # every healthy run) if that pattern were ever overridden.
            count=$(find "$dir" -type f -name '*.json' ! -name manifest.json | wc -l)
            echo "$dir: $count per-run JSON report(s)"
            if [ ! -f "$dir/manifest.json" ]; then
              echo "::warning::$dir/manifest.json does not exist — the $ff table will render its empty state"
            # Evaluate the predicate; do not pattern-match its serialization. An
            # earlier draft grepped for `"isRepresentativeRun": true`, which is
            # coupled to `JSON.stringify(…, null, 2)`'s exact spacing — the same
            # coupling the `count` glob above deliberately avoids, but with
            # `exit 1` behind it. It diverged from the comment's real predicate
            # in BOTH directions: a manifest truncated mid-write that still
            # contained the literal passed GREEN while the comment rendered its
            # empty state, and a compact-JSON manifest would fail RED beside a
            # perfectly populated comment.
            elif ! node -e '
              const fs = require("node:fs");
              try {
                const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.exit(Array.isArray(parsed) && parsed.some((r) => r && r.isRepresentativeRun) ? 0 : 1);
              } catch (err) {
                console.log(`::warning::${process.argv[1]} is unreadable: ${err instanceof Error ? err.message : String(err)}`);
                process.exit(1);
              }
            ' "$dir/manifest.json"; then
              echo "::warning::$dir/manifest.json yielded no representative run — the $ff table will render its empty state"
            else
              landed=$((landed + 1))
            fi
            if [ "$count" -eq 0 ]; then
              echo "::warning::$dir contains no per-run JSON reports"
            fi
          done
          # Full listing so a future regression is diagnosable from the log
          # alone, without re-running the workflow to add debug output.
          find lighthouse-reports -maxdepth 2 -type f 2>/dev/null | sort || true

          if [ "$landed" -eq 0 ] && [ "$ran" -eq 1 ]; then
            # "At least one", not "both": `ran` is an OR, so desktop=failure with
            # mobile=cancelled reaches here. Claiming both ran would be asserting
            # more than the gate establishes.
            echo "::error::At least one Lighthouse step ran and neither form factor produced a manifest with a representative run, so the budget signal was not delivered. This is #4899's regression class; see the annotations above."
            exit 1
          fi
          if [ "$landed" -eq 0 ]; then
            # NOT "see the failing step above": this arm also fires on a
            # cancelled job, where there is no failing step to look at.
            echo "::warning::No reports to verify (desktop=$DESKTOP_OUTCOME mobile=$MOBILE_OUTCOME) — Lighthouse did not run; see the earlier steps in this job."
          fi

      # `lighthouse-reports/` is deliberately not dot-prefixed: this action
      # defaults `include-hidden-files: false`, and the previous
      # `.lighthouseci-*/` paths were therefore filtered out entirely — the
      # run log showed `No files were found with the provided path` even on
      # runs where every report existed. See #4899.
      - name: Upload Lighthouse artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop dev servers
        if: always()
        run: |
          # Negative PID = process group; reaps the server + any children.
          # `|| true` because the PIDs may legitimately be unset if a
          # start step failed before reaching the env-export line.
          kill -- "-$WWW_PGID" 2>/dev/null || true
          kill -- "-$WEB_PGID" 2>/dev/null || true

      - name: Post PR comment
        if: always() && github.event.pull_request != null
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DESKTOP_OUTCOME: ${{ steps.lh-desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.lh-mobile.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const COMMENT_MARKER = '<!-- atlas-lighthouse-budget #2009 -->';

            // Parse the lhci `manifest.json` written into each form-factor
            // dir. Each entry has { url, isRepresentativeRun, summary: {
            // performance, accessibility, 'best-practices', seo } }.
            function readManifest(dir) {
              const manifestPath = path.join(dir, 'manifest.json');
              // Warns rather than returning a bare `[]`. This was the last
              // silent reader in the script, and it is the residual signal for
              // the one drift class the report-path duplication still allows: if
              // these directory literals ever disagree with
              // `lighthouserc.js`'s `outputDir` while the "Verify reports
              // landed" step's own path does not, that step passes, the artifact
              // uploads, and the comment renders its empty state — with this
              // line as the only trace anywhere that a path was wrong.
              if (!fs.existsSync(manifestPath)) {
                core.warning(`no manifest at ${manifestPath}; the ${dir} table will render its empty state`);
                return [];
              }
              try {
                const raw = fs.readFileSync(manifestPath, 'utf8');
                const parsed = JSON.parse(raw);
                // `Array.isArray` + the `r &&` guard keep this EXACTLY as
                // tolerant as the "Verify reports landed" step's predicate. They
                // used to differ: a manifest like `[null, {…true}]` threw here
                // (caught below → empty state) while that step's `some()` passed
                // it green — the two-readers-disagree divergence that step's
                // comment claims to have closed, one entry shape in.
                if (!Array.isArray(parsed)) {
                  core.warning(`manifest at ${manifestPath} is not an array; the ${dir} table will render its empty state`);
                  return [];
                }
                return parsed.filter((r) => r && r.isRepresentativeRun);
              } catch (err) {
                core.warning(
                  `manifest read failed for ${dir}: ${err instanceof Error ? err.message : String(err)}`,
                );
                return [];
              }
            }

            // `manifest.json` records ABSOLUTE report paths, baked in by
            // `lhci upload` on the machine that wrote them, so in this job they
            // resolve as-is. The basename fallback is defensive: it survives the
            // absolute PREFIX changing under us (a different workspace or
            // checkout path with the same relative layout). It does NOT make this
            // script runnable against a downloaded artifact — with a single
            // search path the artifact's root IS the uploaded directory, so an
            // extracted artifact has `desktop/` and `mobile/` at its top level
            // and `readManifest(dir)` would miss the manifest first.
            //
            // Warns rather than returning a bare null: every reader in this
            // script reports its own failure, and an unannotated null here would
            // render `–` in LCP and CLS while Perf/A11y/SEO — which come from
            // the manifest summary, not the file — still looked authoritative.
            // That is #4899 at cell granularity, and #4899 is a bug about a
            // signal that stayed quiet.
            function resolveReportPath(dir, recordedPath) {
              if (typeof recordedPath !== 'string' || recordedPath === '') {
                core.warning(
                  `manifest entry in ${dir} has no usable jsonPath; LCP/CLS will render as –`,
                );
                return null;
              }
              if (fs.existsSync(recordedPath)) return recordedPath;
              const local = path.join(dir, path.basename(recordedPath));
              if (fs.existsSync(local)) return local;
              core.warning(
                `report file missing for ${dir}: tried ${recordedPath} and ${local}; LCP/CLS will render as –`,
              );
              return null;
            }

            // The two audit ids, named once so the id passed to
            // `readAuditNumbers` and the id read back out in the row formatter
            // cannot drift apart. A mistyped identifier is then a ReferenceError
            // rather than a cell quietly reading `–`.
            const LCP = 'largest-contentful-paint';
            const CLS = 'cumulative-layout-shift';

            // Pull lighthouse-typed numeric audit values (LCP, CLS) from the
            // per-run JSON report alongside the manifest summary. Reads the
            // report ONCE and pulls every requested audit from it; a
            // read-and-parse per metric meant parsing each report twice per row.
            //
            // Every arm warns. An audit present but without a numeric value is
            // the realistic case rather than an exotic one — an LCP audit with
            // `scoreDisplayMode: 'error'` has no `numericValue` — and a bare
            // null there renders `–` beside authoritative-looking scores, which
            // is the same cell-level silence `resolveReportPath` was fixed for.
            function readAuditNumbers(jsonReportPath, auditIds) {
              const empty = Object.fromEntries(auditIds.map((id) => [id, null]));
              if (jsonReportPath == null) return empty;
              try {
                const raw = fs.readFileSync(jsonReportPath, 'utf8');
                const parsed = JSON.parse(raw);
                return Object.fromEntries(
                  auditIds.map((id) => {
                    const audit = parsed.audits && parsed.audits[id];
                    if (audit && typeof audit.numericValue === 'number') return [id, audit.numericValue];
                    core.warning(
                      `audit \`${id}\` has no numeric value in ${jsonReportPath}; it will render as –`,
                    );
                    return [id, null];
                  }),
                );
              } catch (err) {
                core.warning(
                  `audit read failed for ${jsonReportPath}: ${err instanceof Error ? err.message : String(err)}`,
                );
                return empty;
              }
            }

            // Strip the `http://localhost:NNNN` prefix so the comment shows
            // a path the reader recognizes (`/`, `/pricing`, `/demo`).
            function pathOf(u) {
              try {
                return new URL(u).pathname || '/';
              } catch {
                // intentionally ignored: `r.url` is manifest-supplied and lhci
                // always writes `lhr.requestedUrl` there, having itself parsed it
                // with `new URL(...)` before writing the entry — so this arm is
                // unreachable today. If a future writer ever puts something else
                // in that field, rendering it raw beats throwing away the whole
                // comment. (The reason recorded here previously — that lhci can
                // surface a synthetic non-URL audit label — is not true of that
                // field.)
                return u;
              }
            }

            function fmtScore(s) {
              if (s == null) return '–';
              return Math.round(s * 100).toString();
            }

            function fmtMs(ms) {
              if (ms == null) return '–';
              return `${Math.round(ms)} ms`;
            }

            function fmtCls(v) {
              if (v == null) return '–';
              return v.toFixed(2);
            }

            // What the empty state is allowed to say, per step `outcome`.
            //
            // `outcome` is the step's PRE-`continue-on-error` result, so it is
            // `failure` whenever `lhci autorun` exited non-zero even though the
            // job carried on. It is NOT limited to success/failure: a step that
            // never executed reports `skipped` or `''`, and a job torn down
            // mid-flight reports `cancelled`. Nothing before the two
            // Lighthouse steps carries `continue-on-error`, so a build or
            // `Wait for servers` failure lands here — and an earlier draft of
            // this script collapsed every non-`failure` outcome into "No
            // reports found.", i.e. it answered "Lighthouse never ran" with
            // #4899's own sentence. The two canonical words are kept for the
            // two outcomes they are actually true of.
            // ⚠️ THE RULE FOR EVERY SENTENCE IN THIS COMMENT: describe what was
            // OBSERVED; never name a cause the signal cannot establish. Where a
            // cause is genuinely useful, name it as a candidate and point at the
            // logs. This is the defect #4899 itself was — a comment asserting
            // "No reports found" about runs that had produced nine reports — and
            // it recurred repeatedly while fixing it, so it is the one to keep
            // watch on.
            const EMPTY_STATE = {
              // Says only that the step exited non-zero and no reports were
              // read — deliberately not why.
              failure: 'Run failed.',
              // NOT "wrote no manifest.json": a manifest containing `[]`, or one
              // that failed to parse, is also read as zero representative runs.
              // "None were read" is what this branch actually establishes.
              success:
                'No reports found. `lhci autorun` reported success but no representative runs could be read — see the "Verify reports landed" step.',
              // NOT "…before reports were written": `upload` writes
              // `manifest.json` LAST, so a cancellation can land after the
              // per-run reports exist. NOT "superseded" either — this workflow
              // has no `concurrency:` block, so a push cannot cancel a run in
              // flight, and naming a cause the configuration makes unreachable
              // is the defect this whole comment is about.
              cancelled:
                'Run cancelled. No representative runs could be read — reports written before it stopped may still be in the artifact.',
              // NOT "…because an earlier step failed": a step that never
              // executed does not say why, and a cancelled job produces this
              // too. Point at the job; assert nothing about it.
              skipped: 'Lighthouse did not run — see the earlier steps in this job.',
              '': 'Lighthouse did not run — see the earlier steps in this job.',
            };

            // Returns `{ markdown, rowCount }`. The count travels with the text
            // so the footer can ask "did anything render?" without re-deriving
            // it by pattern-matching this function's own markdown — a coupling
            // that silently inverts the moment the table's shape changes.
            function tableForFormFactor(label, dir, outcome) {
              const runs = readManifest(dir);
              const failed = outcome === 'failure';
              if (runs.length === 0) {
                // `Object.hasOwn`, not `EMPTY_STATE[key] ?? fallback`: `??` only
                // fires on null/undefined, so every inherited `Object.prototype`
                // key (`constructor`, `toString`, `valueOf`) is truthy and would
                // sail past the fallback and render a native function into the
                // comment. Unreachable with GitHub's fixed vocabulary, but the
                // whole point of this lookup is being total.
                const key = outcome ?? '';
                const why = Object.hasOwn(EMPTY_STATE, key)
                  ? EMPTY_STATE[key]
                  : `Unrecognized step outcome \`${outcome}\`.`;
                return { markdown: `### ${label}\n\n_${why}_ See workflow logs.\n`, rowCount: 0 };
              }
              // Failed-but-populated. Exactly one thing is established — the
              // step exited non-zero — so that is all this says, plus where to
              // look. It deliberately names NO cause: the `assert` phase is the
              // only door to this branch (`collect` and `healthcheck` failures
              // exit before `upload`, so they leave no manifest), and `assert`
              // exits non-zero for config and parse errors as well as for a
              // violated `error`-level budget — which, while every assertion in
              // `lighthouserc.js` is `warn`, cannot reach here at all. Two
              // earlier drafts named a cause anyway and were wrong both times.
              //
              // "The representative runs from the manifest" is also deliberate:
              // the rows are what `readManifest` kept, which is 3 of 9 entries
              // at `numberOfRuns: 3` — not "everything the run wrote".
              const note = failed
                ? `\n> ⚠️ \`lhci autorun\` exited non-zero for ${label.toLowerCase()}. The rows below are the representative runs from the manifest it wrote; see the workflow logs for why the step failed.\n`
                : '';
              const header =
                '| Surface | Perf | A11y | Best Practices | SEO | LCP | CLS |\n' +
                '|---|---|---|---|---|---|---|';
              const rows = runs.map((r) => {
                const audits = readAuditNumbers(resolveReportPath(dir, r.jsonPath), [LCP, CLS]);
                const s = r.summary || {};
                return `| \`${pathOf(r.url)}\` | ${fmtScore(s.performance)} | ${fmtScore(s.accessibility)} | ${fmtScore(s['best-practices'])} | ${fmtScore(s.seo)} | ${fmtMs(audits[LCP])} | ${fmtCls(audits[CLS])} |`;
              });
              return {
                markdown: `### ${label}\n${note}\n${header}\n${rows.join('\n')}\n`,
                rowCount: rows.length,
              };
            }

            const desktop = tableForFormFactor(
              'Desktop',
              'lighthouse-reports/desktop',
              process.env.DESKTOP_OUTCOME,
            );
            const mobile = tableForFormFactor(
              'Mobile',
              'lighthouse-reports/mobile',
              process.env.MOBILE_OUTCOME,
            );
            // Pointing at the artifact unconditionally would send the reader to a
            // 404 on the runs where they most want the reports. But this
            // establishes only "a table rendered", i.e. a readable manifest — NOT
            // "an artifact exists": `if-no-files-found: warn` uploads whatever is
            // under `lighthouse-reports/`, so reports written before an
            // interrupted manifest write DO produce an artifact with no table.
            // So the false arm describes the observation and sends the reader
            // looking anyway, rather than asserting no artifact exists.
            //
            // Read from the builders' own `rowCount` rather than pattern-matching
            // their markdown, which would quietly invert the moment a table gains
            // a column or moves inside a `<details>` — printing "no table"
            // beside two tables.
            const anyTables = desktop.rowCount + mobile.rowCount > 0;

            const body = [
              COMMENT_MARKER,
              '## Lighthouse budget',
              '',
              '> Budget defined in `lighthouserc.js`. Baselines under `apps/www/.design/{landing,pricing,demo}/lighthouse-baseline.md`.',
              '',
              // Precise on purpose: budget assertions are warn-only and never
              // fail a PR, but this job CAN go red — a build or server-start
              // failure fails it, and so does a run that delivered no reports
              // at all. `lighthouse` is not a required check either way.
              '> First-month policy: budget assertions are `warn`-only and never fail a PR. This comment is the signal.',
              '',
              desktop.markdown,
              mobile.markdown,
              '',
              anyTables
                ? '<sub>Full HTML reports are in the `lighthouse-reports` artifact on this run · workflow: `.github/workflows/lighthouse.yml`</sub>'
                : '<sub>No table could be built. Check the `Verify reports landed` step and the run\'s `lighthouse-reports` artifact, if one was produced, for whatever did land · workflow: `.github/workflows/lighthouse.yml`</sub>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.info('No PR number in context; skipping comment.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(COMMENT_MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
