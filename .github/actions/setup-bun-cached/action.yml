name: Setup bun (cached)
description: >-
  The shared job preamble: install bun, restore the shared dependency cache
  keyed on bun.lock, and (by default) run `bun install --frozen-lockfile`.
  This block was copy-pasted across ~14 jobs in 8 workflows before being
  factored out — bump the pinned action SHAs and the install behavior HERE,
  once. The bun VERSION stays a per-workflow `env: BUN_VERSION` on purpose:
  ci.yml's drift job cross-checks that value against every Dockerfile pin,
  so it must remain readable inside the workflow file.

inputs:
  bun-version:
    description: Bun version to install (pass the workflow's env.BUN_VERSION)
    required: true
  install:
    description: >-
      Run `bun install --frozen-lockfile` after restoring the cache. Set to
      "false" for jobs that must control install timing or flags themselves
      (e.g. ci.yml's ee-stub-build installs WITHOUT --frozen-lockfile after
      swapping ee/ for the stub).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@e3914758a49697077f7bcd190d36582a61667aad # v2 + node24 (pending release)
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache bun dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
