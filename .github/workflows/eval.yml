name: Canonical Eval

# Canonical-question eval harness for the consolidated NovaMart demo
# dataset (#2025). Proves the semantic layer (metrics, query_patterns,
# glossary disambiguation, virtual dimensions) returns correct answers to
# a curated set of ~20 questions.
#
# Policy:
#   - Pull requests: informational, but VISIBLE. Historically this used
#     job-level `continue-on-error`, which renders the check green even on
#     failure — an invisible signal nobody opened the run log for. Each job
#     now runs its eval steps with step-level `continue-on-error` and ends
#     with `scripts/eval-informational-gate.sh`: on a PR failure it posts /
#     updates a marker comment on the PR (the lighthouse.yml pattern) and
#     exits 0, so the check stays green and does NOT trip the agent merge
#     discipline (`gh pr checks --watch` green) into treating this as a
#     blocking gate.
#   - Release tags (v*.*.*): blocking. A canonical-question regression
#     should never ship in a tagged release — the gate script exits 1 on
#     any non-PR event.
#   - A job that did NOT RUN fails the gate (#5040). `skipped` used to
#     count as a pass for every job, which is how `eval-mcp-llm` stayed
#     green for its entire life without executing once. It is now an
#     explicit per-label opt-in that only `eval-mcp-llm` holds, and only
#     until #5039 wires AI_GATEWAY_API_KEY. Neither job in THIS file is
#     exempt: a `skipped` eval step here means an earlier infra step
#     already failed the job red, and the gate now says so instead of
#     reporting a pass over it.
#
# ⚠️ THE REAL-MODEL JOB LIVES IN eval-llm.yml, not here (2026-08-10).
#   `on.pull_request.paths` is workflow-scoped — there is no per-job filter —
#   so while `eval-mcp-llm` shared this file it fired on these two jobs'
#   trigger paths too, and it is the only one of the three that costs money.
#   Measured: 136 of 210 triggering merges in 90 days came SOLELY from
#   `lib/semantic/**` and `lib/auth/server.ts`, which are precisely the two
#   paths this file's jobs exist to cover and the LLM eval has nothing to say
#   about. Adding a path here is free; adding one there is not.
#   - Scope note: only the EVAL steps are shielded on PRs. Infra steps
#     (install, types build, DB provision) fail the job red — deliberate:
#     these checks are non-required, and /deps-update already documents the
#     playbook for infra flakes here (visible red → re-run the job).
#
# Modes:
#   - canonical-eval (existing): typed semantic-layer reads + direct SQL
#     execution against seeded Postgres. Validates SQL correctness.
#   - canonical-mcp-eval (new, #2074): every canonical question dispatched
#     through the real `createHostedMcpRouter()` mounted on `Bun.serve`.
#     Validates the MCP **protocol** layer end-to-end — transport, tool
#     dispatch, error envelopes, prompts/list shape, concurrent sessions.
#     `verifyAccessToken` was mocked in Phase 1 (#2074); Phase 2 part A
#     (#2119, eb7efe18) replaced the mock with a real OAuth 2.1 loopback
#     round-trip against an in-process Better Auth instance for full
#     JWT/JWKS-path coverage.
#   The optional `--llm` mode for canonical-eval exists for local
#   exploration; we don't run it in CI to keep the gate stable.
#
# Workflow-injection notes:
#   - No untrusted PR/issue/commit fields are spliced into `run:` strings.
#   - Bun + Postgres versions templated into `run:` come from the workflow's
#     own `env:` block — repo-controlled, not attacker-controlled.
#   - The informational-gate steps forward only `steps.*.outcome`, the PR
#     number, and server-side run metadata via `env:`; the PR comment body is
#     assembled inside scripts/eval-informational-gate.sh from those fields
#     alone. `pull-requests: write` below exists solely for that comment.

on:
  pull_request:
    branches: [main]
    paths:
      - "eval/canonical-questions/**"
      - "packages/cli/bin/canonical-eval*.ts"
      - "packages/cli/bin/atlas.ts"
      - "packages/cli/lib/help.ts"
      - "packages/cli/data/seeds/ecommerce/**"
      - "packages/api/src/lib/semantic/**"
      # MCP-path eval (#2074): trigger on changes to the MCP route, the
      # tools the eval dispatches, the prompts/resources surfaces it
      # asserts shape on, the auth surface that issues / verifies
      # bearers, and the eval helpers themselves. `canonical-mcp-*.ts`
      # already matches `canonical-mcp-eval.evalspec.ts` since the
      # extension still ends in `.ts`.
      - "packages/mcp/src/__tests__/canonical-mcp-*.ts"
      # ⚠️ The LLM eval's own paths are NOT here — `packages/mcp/src/eval/**`,
      # `canonical-eval-mcp-llm.ts` and the baseline moved to
      # eval-llm.yml with the job that reads them. Listing them here would
      # trigger the two deterministic jobs for a change that says nothing to
      # either, which is the mirror of the problem the split fixed.
      - "packages/mcp/src/hosted.ts"
      - "packages/mcp/src/server.ts"
      - "packages/mcp/src/actor.ts"
      - "packages/mcp/src/tools.ts"
      - "packages/mcp/src/semantic-tools.ts"
      - "packages/mcp/src/prompts.ts"
      - "packages/mcp/src/resources.ts"
      - "packages/mcp/src/error-envelope.ts"
      - "packages/mcp/package.json"
      - "packages/api/src/lib/auth/server.ts"
      - "packages/api/src/lib/auth/oauth-claims.ts"
      # Phase 2 (#2119) — the in-process OAuth helper + the published
      # @useatlas/mcp/init flow it drives. A drift in either trips the
      # auth-helper smoke test in the same job, so the trigger paths
      # cover both even though only the eval job depends on them.
      - "plugins/mcp/src/init/hosted.ts"
      - "plugins/mcp/src/init/index.ts"
      - ".github/workflows/eval.yml"
      # The gate step every job above ends with. A change to it changes
      # what green means for all three, so it re-triggers them.
      - "scripts/eval-informational-gate.sh"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  pull-requests: write # informational-gate PR comments only

env:
  BUN_VERSION: "1.4.0"

jobs:
  canonical-eval:
    name: canonical-eval
    runs-on: ubuntu-latest
    # PR runs are informational (green check + PR comment on failure); tag
    # pushes are blocking. Both behaviors live in the informational-gate
    # step at the end of the job — see the Policy block above.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build @useatlas/types (resolves api imports)
        run: bun run --filter '@useatlas/types' build

      # `seedDemoPostgres` expects an existing target database; we provision
      # `atlas_demo` here so the harness can drop/recreate the seed schema
      # against a clean DB without polluting `atlas` (the internal DB).
      - name: Provision atlas_demo database
        env:
          PGPASSWORD: atlas
        run: |
          bun x wait-on tcp:127.0.0.1:5432 --timeout 60000
          psql -h 127.0.0.1 -U atlas -d atlas -c "CREATE DATABASE atlas_demo;"

      - name: Run canonical eval (deterministic)
        id: eval
        continue-on-error: true
        env:
          ATLAS_DATASOURCE_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas_demo
          DATABASE_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas
        run: bun packages/cli/bin/atlas.ts canonical-eval

      - name: Informational gate (PR comment on failure; blocks tags)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
        run: bash scripts/eval-informational-gate.sh canonical-eval "$EVAL_OUTCOME"

  # MCP-path eval (#2074, Phase 1; #2119, Phase 2 part A). Runs every
  # canonical question through the real `createHostedMcpRouter` mounted
  # on `Bun.serve`, exercising transport / dispatch / envelope / prompts
  # shape / concurrent sessions / session-cap enforcement. Phase 2 part A
  # (#2119) replaces the `verifyAccessToken` mock with a real OAuth 2.1
  # round-trip against an in-process Better Auth instance — the issued
  # JWT goes through real signature verification + JWKS resolution, so a
  # regression in the JWT-path now fails this gate. The auth-helper
  # smoke test (`canonical-mcp-auth.test.ts`) runs first so a regression
  # in the helper trips before the full evalspec.
  #
  # No Postgres needed: the eval mocks `executeSQL` so SQL correctness is
  # owned by the deterministic job above. This job is purely the MCP
  # **protocol + JWT** gate.
  canonical-mcp-eval-deterministic:
    name: canonical-mcp-eval (deterministic)
    runs-on: ubuntu-latest
    # Same policy as the deterministic job: PRs informational-but-visible,
    # tag pushes blocking (the informational-gate step at the end). A
    # protocol-shape regression must not ship in a tag.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build @useatlas/types (resolves api imports)
        run: bun run --filter '@useatlas/types' build

      - name: Run MCP auth helper smoke test (#2119)
        id: auth-smoke
        continue-on-error: true
        run: bun test ./packages/mcp/src/__tests__/canonical-mcp-auth.test.ts

      - name: Run MCP-path canonical eval
        id: evalspec
        # Still worth running when the auth smoke failed — the evalspec's
        # transport/envelope coverage is independent of the auth helper, and
        # both outcomes reach the gate below.
        continue-on-error: true
        run: bun test ./packages/mcp/src/__tests__/canonical-mcp-eval.evalspec.ts

      - name: Informational gate (PR comment on failure; blocks tags)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTH_OUTCOME: ${{ steps.auth-smoke.outcome }}
          EVAL_OUTCOME: ${{ steps.evalspec.outcome }}
        run: bash scripts/eval-informational-gate.sh canonical-mcp-eval "$AUTH_OUTCOME" "$EVAL_OUTCOME"
