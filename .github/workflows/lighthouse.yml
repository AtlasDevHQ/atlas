name: Lighthouse

# Marketing-surface Lighthouse budget (#2009). Runs on PRs that touch
# either of the two Next.js apps that produce visitor-facing surfaces
# (`apps/www` for `/` + `/pricing`, `packages/web` for `/demo`) or the
# config / workflow itself.
#
# First-month policy: every budget assertion in `lighthouserc.js` is
# `warn`-only and never fails a PR. The signal is the auto-posted PR comment —
# we want a few weeks of "is this stable on shared runners?" data before
# promoting any assertion to `error`.
#
# The JOB, however, can go red, and saying otherwise here was wrong: a build or
# server-start failure fails it, and so does a run where both Lighthouse steps
# ran and delivered no reports (`Verify reports landed`). `lighthouse` is not a
# required check either way, so neither blocks a PR.
#
# Workflow-injection notes (per the GitHub Actions hardening guide):
#   - No untrusted PR/issue/commit fields are ever spliced into `run:`
#     strings. Step `outcome`s are forwarded to the comment script via
#     `env:`, and the comment body is built server-side in JS only from
#     fields the workflow itself produced (manifest.json, JSON reports).
#   - The bun + lhci versions templated into `run:` are pulled from the
#     workflow's own `env:` block — repo-controlled, not attacker-controlled.

on:
  pull_request:
    paths:
      - "apps/www/**"
      - "packages/web/**"
      - "lighthouserc.js"
      - ".github/workflows/lighthouse.yml"

permissions:
  contents: read
  pull-requests: write

env:
  BUN_VERSION: "1.4.0"
  LHCI_VERSION: "0.15.1"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # @atlas/web's build needs the published-shape SDK packages at import
      # time — `@useatlas/types` resolves to its dist via package exports,
      # so without these the Next build fails on `cannot find module`.
      - name: Build SDK packages
        run: |
          bun run --filter '@useatlas/types' build
          bun run --filter '@useatlas/plugin-sdk' build
          bun run --filter '@useatlas/sdk' build
          bun run --filter '@useatlas/react' build

      - name: Build apps/www (static export)
        run: bun run --filter '@atlas/www' build

      - name: Build packages/web
        run: bun run --filter '@atlas/web' build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # `setsid` puts each server in its own process group so the cleanup
      # step's `kill -- -<PGID>` reaps the actual `next` / `serve.ts`
      # process plus any children. Using a plain `&` + `$!` would only
      # capture the wrapper PID; killing it leaves the real server alive.
      - name: Start apps/www on :8080
        run: |
          PORT=8080 setsid bun apps/www/serve.ts > /tmp/www.log 2>&1 < /dev/null &
          echo "WWW_PGID=$!" >> "$GITHUB_ENV"

      - name: Start packages/web on :3000
        run: |
          cd packages/web && PORT=3000 setsid bun x next start > /tmp/web.log 2>&1 < /dev/null &
          echo "WEB_PGID=$!" >> "$GITHUB_ENV"

      - name: Wait for servers
        run: |
          set -e
          for url in http://localhost:8080/health http://localhost:3000/demo; do
            echo "Waiting for $url ..."
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then
                echo "  ready"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::$url never came up; last 50 log lines:"
                tail -n 50 /tmp/www.log /tmp/web.log || true
                exit 1
              fi
              sleep 1
            done
          done

      # `lhci autorun` runs healthcheck → collect → assert → upload. The config
      # decides the URLs and presets; LH_FORM_FACTOR switches desktop ↔ mobile,
      # and also picks the `upload.outputDir` — each form factor writes its own
      # `lighthouse-reports/<form-factor>/` with a `manifest.json`.
      # `continue-on-error: true` so one form factor failing still lets the
      # comment step render the other one's table.
      #
      # `--failOnUploadFailure` is load-bearing, not belt-and-braces. Without
      # it, `autorun` prints `WARNING: upload command failed.` to stderr and
      # STILL EXITS 0 (`src/autorun/autorun.js`: the `process.exit(uploadStatus)`
      # is guarded on this very flag). Upload is the step that writes the
      # reports, so the one failure mode this workflow exists to notice —
      # reports not landing — otherwise produces a GREEN step, and the comment
      # then says "No reports found." instead of "Run failed.": #4899's exact
      # sentence, on a run that failed for a reason we had just been told.
      #
      # There is deliberately no "stash the reports" step between the two runs.
      # #4899 blamed one for losing them. It did not: `lhci collect` really does
      # write `lhr-*.json` into `.lighthouseci` (and `assert` adds
      # `assertion-results.json`), while `healthcheck` creates that directory
      # before `collect` even runs — so on any run where `autorun` actually
      # started, `[ -d .lighthouseci ]` was true and its `mv` fired.
      # The single file that was never there is `manifest.json`, which only the
      # `filesystem` upload target writes and which is the only file gating the
      # tables — without it no row renders at all, whatever else is on disk.
      # `lhci` now writes each form factor straight to its own
      # directory, so there is nothing to move and nothing to overwrite: the
      # mobile run's `collect` clears `.lighthouseci`, but desktop's reports
      # already live outside it.
      - name: Lighthouse (desktop)
        id: lh-desktop
        continue-on-error: true
        env:
          LH_FORM_FACTOR: desktop
        run: bun x @lhci/cli@${{ env.LHCI_VERSION }} autorun --failOnUploadFailure --config=./lighthouserc.js

      - name: Lighthouse (mobile)
        id: lh-mobile
        continue-on-error: true
        env:
          LH_FORM_FACTOR: mobile
        run: bun x @lhci/cli@${{ env.LHCI_VERSION }} autorun --failOnUploadFailure --config=./lighthouserc.js

      # #4899's whole failure mode was SILENCE: the reports were missing for
      # THREE MONTHS — the workflow landed 2026-05-02 and the defect shipped
      # with it, across 1200+ runs — and the only symptom was a PR comment
      # politely saying "No reports found", on a green workflow. This step exists
      # so that never reads as green again.
      #
      # It evaluates the same predicate the comment does — at least one manifest
      # entry with `isRepresentativeRun: true`, parsed rather than pattern-
      # matched. An earlier draft checked only that the directory and
      # `manifest.json` existed and that some `*.report.json` was present; a
      # `manifest.json` containing `[]` passes all three of those and still
      # renders the empty state, which is the #4899 shape one layer in.
      #
      # Escalation policy, deliberately narrow: a form factor missing its
      # reports is a `::warning::`, but BOTH missing is a plumbing failure and
      # exits non-zero — PROVIDED the Lighthouse steps actually ran. The gate on
      # `$ran` is load-bearing: this step is `if: always()` and nothing before
      # the Lighthouse steps carries `continue-on-error`, so a failed build or a
      # server that never came up reaches here with no reports at all. Escalating
      # there would stack a second red annotation on a run whose real signal is
      # the build failure, and blame it on a plumbing regression it is not.
      #
      # Failing here does not violate the first-month warn-only policy, which is
      # about budget ASSERTIONS: `lighthouse` is not currently a required check
      # (see `docs/development/branch-protection.md`), so a red run is visible
      # without blocking any PR. #4899 survived three months precisely because a
      # polite annotation under a green check goes unread.
      - name: Verify reports landed
        if: always()
        env:
          DESKTOP_OUTCOME: ${{ steps.lh-desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.lh-mobile.outcome }}
        run: |
          # Only `success` and `failure` mean the step executed. `skipped` and
          # `''` mean it never started, and `cancelled` means the job was torn
          # down — in none of those is a missing report this step's news.
          ran=0
          case "$DESKTOP_OUTCOME" in success|failure) ran=1 ;; esac
          case "$MOBILE_OUTCOME" in success|failure) ran=1 ;; esac

          landed=0
          for ff in desktop mobile; do
            dir="lighthouse-reports/$ff"
            if [ ! -d "$dir" ]; then
              echo "::warning::$dir does not exist — the $ff table will render its empty state"
              continue
            fi
            # Decoupled from lhci's `reportFilenamePattern` on purpose: matching
            # `*.report.json` would silently start counting 0 (and warning on
            # every healthy run) if that pattern were ever overridden.
            count=$(find "$dir" -type f -name '*.json' ! -name manifest.json | wc -l)
            echo "$dir: $count per-run JSON report(s)"
            if [ ! -f "$dir/manifest.json" ]; then
              echo "::warning::$dir/manifest.json does not exist — the $ff table will render its empty state"
            # Evaluate the predicate; do not pattern-match its serialization. An
            # earlier draft grepped for `"isRepresentativeRun": true`, which is
            # coupled to `JSON.stringify(…, null, 2)`'s exact spacing — the same
            # coupling the `count` glob above deliberately avoids, but with
            # `exit 1` behind it. It diverged from the comment's real predicate
            # in BOTH directions: a manifest truncated mid-write that still
            # contained the literal passed GREEN while the comment rendered its
            # empty state, and a compact-JSON manifest would fail RED beside a
            # perfectly populated comment.
            elif ! node -e '
              const fs = require("node:fs");
              try {
                const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.exit(Array.isArray(parsed) && parsed.some((r) => r && r.isRepresentativeRun) ? 0 : 1);
              } catch (err) {
                console.log(`::warning::${process.argv[1]} is unreadable: ${err instanceof Error ? err.message : String(err)}`);
                process.exit(1);
              }
            ' "$dir/manifest.json"; then
              echo "::warning::$dir/manifest.json yielded no representative run — the $ff table will render its empty state"
            else
              landed=$((landed + 1))
            fi
            if [ "$count" -eq 0 ]; then
              echo "::warning::$dir contains no per-run JSON reports"
            fi
          done
          # Full listing so a future regression is diagnosable from the log
          # alone, without re-running the workflow to add debug output.
          find lighthouse-reports -maxdepth 2 -type f 2>/dev/null | sort || true

          if [ "$landed" -eq 0 ] && [ "$ran" -eq 1 ]; then
            # "At least one", not "both": `ran` is an OR, so desktop=failure with
            # mobile=cancelled reaches here. Claiming both ran would be asserting
            # more than the gate establishes.
            echo "::error::At least one Lighthouse step ran and neither form factor produced a manifest with a representative run, so the budget signal was not delivered. This is #4899's regression class; see the annotations above."
            exit 1
          fi
          if [ "$landed" -eq 0 ]; then
            # NOT "see the failing step above": this arm also fires on a
            # cancelled job, where there is no failing step to look at.
            echo "::warning::No reports to verify (desktop=$DESKTOP_OUTCOME mobile=$MOBILE_OUTCOME) — Lighthouse did not run; see the earlier steps in this job."
          fi

      # `lighthouse-reports/` is deliberately not dot-prefixed: this action
      # defaults `include-hidden-files: false`, and the previous
      # `.lighthouseci-*/` paths were therefore filtered out entirely — the
      # run log showed `No files were found with the provided path` even on
      # runs where every report existed. See #4899.
      - name: Upload Lighthouse artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop dev servers
        if: always()
        run: |
          # Negative PID = process group; reaps the server + any children.
          # `|| true` because the PIDs may legitimately be unset if a
          # start step failed before reaching the env-export line.
          kill -- "-$WWW_PGID" 2>/dev/null || true
          kill -- "-$WEB_PGID" 2>/dev/null || true

      # ⚠️ THE RENDERER IS A COMMITTED FILE, not 250 lines of JS in this block
      # (#5174). Inside the YAML it was reachable by NO gate in this repo —
      # oxlint does not parse YAML, `bun run type` never saw it,
      # `scripts/test-others.ts` only discovers workspace packages, and there is
      # no actionlint step anywhere. The only validation was running the
      # workflow, on a PR that happened to touch the filtered paths above. That
      # matters because what it renders is a CLAIM about a run, and #4899 was a
      # false one that stood for three months and 1200+ runs; its fix cost six
      # separate false-or-overreaching message claims across two review rounds,
      # four of them introduced by the fix for a previous one. The class-closure
      # was guarded only by review attention, which is what had just failed.
      #
      # `scripts/__tests__/lighthouse-comment.test.sh` is that guard, and it
      # carries the retired-wording ratchet that used to live only in an
      # out-of-tree harness. `.github/scripts/` is in both oxlint path lists in
      # package.json, so the file is linted too.
      #
      # ⚠️ ABSOLUTE require path. `actions/github-script` evaluates this script
      # from the ACTION's directory, not the workspace, so a relative
      # `require('./.github/scripts/…')` does not resolve. Getting it wrong fails
      # only at workflow runtime — the exact invisibility class this refactor
      # closes — so the fixture suite asserts this literal against the file on
      # disk rather than trusting it.
      - name: Post PR comment
        if: always() && github.event.pull_request != null
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DESKTOP_OUTCOME: ${{ steps.lh-desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.lh-mobile.outcome }}
        with:
          script: |
            const { buildBody, COMMENT_MARKER } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/lighthouse-comment.js`,
            );

            const { body } = buildBody({
              fs: require('node:fs'),
              path: require('node:path'),
              core,
              env: process.env,
            });

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.info('No PR number in context; skipping comment.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(COMMENT_MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
