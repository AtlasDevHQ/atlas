name: Refresh test timings

# Regenerate `packages/api/scripts/test-timings.json` from durations measured ON
# CI RUNNERS (#5383).
#
# ## Why this is a workflow and not a script
#
# `test-timings.json` balances the four `api-tests` shards by measured per-file
# duration. It was committed once, at #2802, and had never been regenerated —
# every number in it described the suite as it stood two thousand commits
# earlier. `ci.yml` always said the file was advisory and named a regeneration
# command; what it did not do was give anyone a way to run that command on the
# machine the balance has to be right FOR.
#
# A developer box is the wrong instrument, and #5383 recorded the two ways that
# was learned rather than reasoned:
#
#   - `--update-timings` with `TEST_DATABASE_URL` set hangs against one local
#     Postgres (60 `-pg` suites contending; each passes alone). It still wrote a
#     file after the hang — finished files carrying local numbers, unfinished
#     ones keeping #2802's. A half-measured balancer is worse than either input.
#   - Running WITHOUT `TEST_DATABASE_URL` is not a workaround: the `-pg` suites
#     skip in milliseconds and would record as the FASTEST files in the suite,
#     which is precisely backwards.
#
# Runner CPU count and IO are what the balance has to fit, so the measurement
# belongs here.
#
# ## How the merge works, and why it is sound
#
# `bun test --update-timings` writes to the FIRST `--timings` path, and under
# `--shard` it writes ONLY the files that shard ran. So four legs produce four
# DISJOINT maps whose union is the whole suite — no last-writer-wins ambiguity
# and no stale entries carried through. Verified against bun 1.4.0 before this
# workflow was written: a 6-file probe sharded 1/2 and 2/2 produced {a1,a3,a5}
# and {a2,a4,a6}, merging to exactly the 6.
#
# The second `--timings` is the COMMITTED file, read for balance only. Measuring
# under the shard composition production actually uses is the point: a file's
# duration depends on what it contends with.
#
# ## Using it
#
#   gh workflow run test-timings-refresh.yml --ref main
#
# The merge job opens (or force-updates) a PR from `ci/test-timings-refresh`
# carrying the merged file and the rewritten `LAST REGENERATED` line in
# `ci.yml`'s `api-tests` job. Three things trigger it:
#
#   - `schedule`, monthly. The file goes stale in ways no one sees — a PR that
#     adds six `-pg` suites changes nothing in the balancer — so a fixed cadence
#     bounds the staleness whether or not anyone looks.
#   - `ci.yml`'s `shard-balance` job, which measures the spread on every green
#     `main` push and dispatches this when it passes 1.5x (see
#     `.github/scripts/measure-shard-spread.ts` for why the median and why 1.5x).
#   - By hand, as above.
#
# ⚠️ A PR opened with `GITHUB_TOKEN` gets NO workflow runs — GitHub suppresses
# events raised by that token — so its required checks never appear and it
# cannot be merged as-is. Close and reopen it (a human event) and every check
# runs. To skip that step, add a fine-grained PAT with `contents` and
# `pull-requests` write on this repo as the `TIMINGS_REFRESH_PAT` secret; the
# merge job uses it when present and falls back to `GITHUB_TOKEN` otherwise.
#
# The merge REFUSES a sweep that ran without a database (the `-pg` median
# floor in merge-test-timings.ts), so the PR body's merge log is the evidence
# the durations are real; the eyeball check ci.yml used to describe is now a
# gate.
#
# ⚠️ This does NOT fix a preempted shard. A runner that receives a shutdown
# signal was not slow, and rebalancing cannot touch it — see #5383's own comment
# and the sibling issue it points at. Two different problems wearing one symptom.

on:
  # No dispatch inputs, deliberately. An earlier cut had a `shards` knob
  # defaulting to "4" that fed the divisor of the shard argument while the matrix
  # below stayed hardcoded [1,2,3,4] — so dispatching it with 2 would have run
  # legs numbered 3 and 4 out of 2. The shard count has to match ci.yml's
  # api-tests matrix for the measurement to mean anything, so a knob that can
  # only ever disagree with it is a footgun rather than a feature. To reshard,
  # change BOTH matrices and the merge step's --expect-shards together.
  workflow_dispatch:
  # Monthly, early on the 1st (UTC). Cheap — four runners for ~3 minutes — and
  # the PR it opens is the only output, so a month in which nothing drifted
  # costs one PR to close. `shard-balance` in ci.yml covers the gap between.
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"

jobs:
  measure:
    name: measure (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Same preamble as ci.yml's api-tests: both packages resolve to their
      # `dist/` via "exports", so api tests cannot import them unbuilt.
      - name: Build @useatlas/types + @useatlas/plugin-sdk
        run: bun run build:sdk:core

      - name: Measure shard ${{ matrix.shard }}/4
        working-directory: packages/api
        env:
          # ⚠️ REQUIRED here, unlike a local run. Without it the `-pg` suites
          # skip in milliseconds and record as the fastest files in the suite,
          # which would produce a balancer that is actively worse than the stale
          # one it replaces.
          TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas
        # ⚠️ No `timeout-minutes`, matching api-tests deliberately: a sweep
        # killed halfway writes a partial map, and a partial map is the one input
        # worse than a stale one. #5383's acceptance criteria say so explicitly.
        #
        # Output path FIRST — that is the file `--update-timings` writes. The
        # committed file is second and is read for balance only.
        run: |
          bun test --parallel \
            --shard=${{ matrix.shard }}/4 \
            --timings=/tmp/measured-${{ matrix.shard }}.json \
            --timings=scripts/test-timings.json \
            --update-timings

      - name: Upload shard ${{ matrix.shard }} durations
        # `always()` — a shard that ends red still measured every file that ran,
        # and the merge below reports coverage rather than trusting it. Losing a
        # whole refresh to one unrelated failure is the wrong trade.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-shard-${{ matrix.shard }}
          path: /tmp/measured-${{ matrix.shard }}.json
          if-no-files-found: error
    services:
      # ⚠️ Load-bearing, and its absence would be SILENT in the worst way: with
      # no Postgres the `-pg` suites self-skip in milliseconds and get recorded
      # as the fastest files in the suite. The refresh would "succeed" and ship a
      # balancer that puts the sixty heaviest files wherever it likes. Mirrors
      # ci.yml's api-tests service exactly, because the durations have to be
      # measured under the conditions they will be used to balance.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  merge:
    name: merge
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    # Job-scoped: the measuring legs stay read-only. `contents: write` pushes
    # the refresh branch; `pull-requests: write` opens or edits the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The PAT, when the repo has one, so the PR's checks run without a
          # close/reopen (see the header). An unset secret is the empty string,
          # which `||` skips.
          token: ${{ secrets.TIMINGS_REFRESH_PAT || secrets.GITHUB_TOKEN }}

      # `install: "false"` — the merge script has no dependencies, so this only
      # needs the bun BINARY and can skip the monorepo install entirely.
      - uses: ./.github/actions/setup-bun-cached
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install: "false"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-timings-shard-*
          path: /tmp/shards
          merge-multiple: false

      - name: Merge shard durations
        id: merge
        # `tee` keeps the log for the PR body; `pipefail` keeps the exit code.
        run: |
          set -o pipefail
          bun .github/scripts/merge-test-timings.ts \
            --out packages/api/scripts/test-timings.json \
            --baseline packages/api/scripts/test-timings.json \
            --expect-shards 4 \
            /tmp/shards/*/measured-*.json | tee /tmp/merge.log

      - name: Upload merged timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-merged
          path: packages/api/scripts/test-timings.json
          if-no-files-found: error

      - name: Show the diff against the committed file
        run: git --no-pager diff --stat -- packages/api/scripts/test-timings.json || true

      - name: Rewrite the LAST REGENERATED line in ci.yml
        # One machine-owned line; the history around it is prose the sed does
        # not touch. Zero or several matches means the comment was reshaped and
        # this step would edit the wrong thing, so it stops instead.
        run: |
          set -euo pipefail
          n=$(grep -c '^ *# LAST REGENERATED: ' .github/workflows/ci.yml || true)
          if [ "$n" != "1" ]; then
            echo "::error::expected exactly one '# LAST REGENERATED:' line in ci.yml, found $n"
            exit 1
          fi
          stamp="$(date -u +%F) run ${GITHUB_RUN_ID} ${GITHUB_REF_NAME} ${GITHUB_SHA:0:9} (${GITHUB_EVENT_NAME})"
          sed -i -E "s|^( *# LAST REGENERATED: ).*$|\1${stamp}|" .github/workflows/ci.yml
          grep -n '^ *# LAST REGENERATED: ' .github/workflows/ci.yml

      - name: Open or update the refresh PR
        env:
          GH_TOKEN: ${{ secrets.TIMINGS_REFRESH_PAT || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.TIMINGS_REFRESH_PAT != '' }}
          BRANCH: ci/test-timings-refresh
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/api/scripts/test-timings.json; then
            echo "test-timings.json is byte-identical to the committed file; nothing to propose."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add packages/api/scripts/test-timings.json .github/workflows/ci.yml
          git commit -q -m "chore(ci): refresh test-timings.json from run ${GITHUB_RUN_ID}"
          git push --force --quiet origin "$BRANCH"

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Regenerated \`packages/api/scripts/test-timings.json\` on CI runners — [run ${GITHUB_RUN_ID}](${run_url}), \`${GITHUB_EVENT_NAME}\` on \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA:0:9}."
            echo
            echo "The merge refused nothing, so every \`-pg\` suite was measured against Postgres (median in the log below). Merging this rebalances the four \`api-tests\` shards; nothing else changes."
            echo
            echo '## Merge log'
            echo
            echo '```'
            cat /tmp/merge.log
            echo '```'
            echo
            echo '## Files'
            echo
            echo '- `packages/api/scripts/test-timings.json` — the balancer'
            echo '- `.github/workflows/ci.yml` — the `LAST REGENERATED` line only'
            if [ "$HAS_PAT" != "true" ]; then
              echo
              echo '> ⚠️ Opened with `GITHUB_TOKEN`, so GitHub ran **no workflows** on this PR and its required checks are absent. **Close and reopen it** and they run. To skip that step next time, add a fine-grained PAT (contents + pull-requests write) as the `TIMINGS_REFRESH_PAT` secret.'
            fi
          } >/tmp/body.md

          existing=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" -R "$GITHUB_REPOSITORY" --body-file /tmp/body.md
            echo "updated PR #$existing"
          else
            gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore(ci): refresh test-timings.json (run ${GITHUB_RUN_ID})" \
              --body-file /tmp/body.md
          fi
